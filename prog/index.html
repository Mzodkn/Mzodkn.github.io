<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discrete Mathematics Platform</title>
  
  <!-- استدعاء Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- استدعاء الخطوط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- إعدادات التصميم -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { slate: { 900: '#0f172a', 800: '#1e293b' } },
          fontFamily: { sans: ['Inter', 'Cairo', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- مكتبة MathJax لمعادلات الرياضيات -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- تنسيق شريط التمرير (Scrollbar) -->
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex overflow-hidden transition-all duration-300">

  <!-- القائمة الجانبية (Sidebar) -->
  <aside id="sidebar" class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col transition-all duration-300 rtl:border-l rtl:border-r-0">
    <div class="p-4 border-b border-slate-700">
      <h1 class="text-xl font-bold text-blue-400" id="site-title">Math & Logic</h1>
    </div>
    <!-- سيتم تعبئة الروابط هنا عبر الجافاسكريبت -->
    <nav class="flex-1 overflow-y-auto p-4 space-y-2" id="module-nav"></nav>
  </aside>

  <!-- المحتوى الرئيسي (Main Content) -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- شريط التنقل العلوي (Navbar) -->
    <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-6">
      <div class="flex items-center gap-4">
        <button id="toggle-sidebar" class="text-slate-400 hover:text-white p-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="text-sm text-slate-400" id="breadcrumbs">Module 1 > Propositional Logic</div>
      </div>
      <div class="flex items-center gap-4">
        <div class="relative">
          <input type="text" id="search-bar" placeholder="Search topics..." class="bg-slate-900 border border-slate-700 rounded-lg px-4 py-1 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <button id="lang-toggle" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm font-semibold transition-colors">
          عربي
        </button>
      </div>
    </header>

    <!-- مساحة المحتوى التي ستتغير ديناميكياً -->
    <div class="flex-1 overflow-y-auto p-8" id="content-area"></div>
  </main>

  <!-- ربط ملف الجافاسكريبت الخارجي -->
  <script src="app.js"></script>
</body>
</html>
