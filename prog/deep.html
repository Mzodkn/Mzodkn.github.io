<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discrete Mathematics — Interactive Study Platform</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #273449;
            --bg-elevated: #263449;
            --border-subtle: #334155;
            --border-strong: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-violet: #a78bfa;
            --success: #34d399;
            --warning: #fbbf24;
            --error: #f87171;
            --code-bg: #0d1424;
            --sidebar-bg: #121a2b;
            --sidebar-width: 300px;
            --header-height: 64px;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(var(--header-height) + 20px);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', 'Readex Pro', sans-serif;
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body[dir="rtl"] {
            font-family: 'Cairo', 'Readex Pro', 'Inter', sans-serif;
        }

        body[dir="rtl"] code,
        body[dir="rtl"] .math-symbol,
        body[dir="rtl"] .en-term {
            font-family: 'Inter', 'Readex Pro', monospace;
            direction: ltr;
            display: inline-block;
        }

        /* Sidebar */
        .sidebar {
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-subtle);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: var(--sidebar-width);
            z-index: 50;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }
        body[dir="rtl"] .sidebar {
            left: auto;
            right: 0;
            border-right: none;
            border-left: 1px solid var(--border-subtle);
        }

        .sidebar::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 3px;
        }

        .sidebar.closed {
            transform: translateX(-100%);
        }
        body[dir="rtl"] .sidebar.closed {
            transform: translateX(100%);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 0;
            min-height: 100vh;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body[dir="rtl"] .main-content {
            margin-left: 0;
            margin-right: var(--sidebar-width);
        }
        .main-content.expanded {
            margin-left: 0;
        }
        body[dir="rtl"] .main-content.expanded {
            margin-right: 0;
        }

        /* Overlay for mobile */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 45;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* Nav items */
        .nav-chapter {
            border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        }
        .nav-chapter-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            transition: background-color 0.15s, color 0.15s;
        }
        body[dir="rtl"] .nav-chapter-btn {
            text-align: right;
        }
        .nav-chapter-btn:hover {
            background-color: rgba(56, 189, 248, 0.08);
            color: var(--text-primary);
        }
        .nav-chapter-btn.active {
            background-color: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }
        body[dir="rtl"] .nav-chapter-btn.active {
            border-left: none;
            border-right: 3px solid var(--accent);
        }

        .nav-sublinks {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-sublinks.open {
            max-height: 600px;
        }
        .nav-sublink {
            display: block;
            padding: 8px 16px 8px 32px;
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s, background-color 0.15s;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        body[dir="rtl"] .nav-sublink {
            padding: 8px 32px 8px 16px;
            text-align: right;
        }
        .nav-sublink:hover {
            color: var(--text-primary);
            background-color: rgba(255, 255, 255, 0.04);
        }
        .nav-sublink.active {
            color: var(--accent);
        }

        /* Cards and components */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: var(--border-strong);
        }

        .definition-box {
            background-color: rgba(56, 189, 248, 0.06);
            border-left: 4px solid var(--accent);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
        }
        body[dir="rtl"] .definition-box {
            border-left: none;
            border-right: 4px solid var(--accent);
            border-radius: 8px 0 0 8px;
        }

        .example-box {
            background-color: rgba(167, 139, 250, 0.06);
            border-left: 4px solid var(--accent-violet);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
        }
        body[dir="rtl"] .example-box {
            border-left: none;
            border-right: 4px solid var(--accent-violet);
            border-radius: 8px 0 0 8px;
        }

        .key-takeaway {
            background-color: rgba(52, 211, 153, 0.06);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 12px 0;
        }

        .truth-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }
        .truth-table th,
        .truth-table td {
            padding: 10px 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }
        .truth-table th {
            background-color: var(--bg-elevated);
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .truth-table td {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .truth-table tr:last-child td {
            border-bottom: none;
        }
        .truth-table .highlight {
            background-color: rgba(56, 189, 248, 0.12);
            color: var(--accent);
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.15s;
            margin: 6px 0;
            font-size: 0.9rem;
        }
        .quiz-option:hover {
            border-color: var(--border-strong);
            background-color: rgba(255, 255, 255, 0.03);
        }
        .quiz-option.correct {
            border-color: var(--success);
            background-color: rgba(52, 211, 153, 0.1);
            color: var(--success);
        }
        .quiz-option.incorrect {
            border-color: var(--error);
            background-color: rgba(248, 113, 113, 0.1);
            color: var(--error);
        }
        .quiz-option input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .search-highlight {
            background-color: rgba(251, 191, 36, 0.3);
            padding: 0 2px;
            border-radius: 2px;
        }

        .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 0;
        }
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }
        .breadcrumb a:hover {
            color: var(--accent);
        }
        .breadcrumb .separator {
            color: var(--border-strong);
        }

        .code-block {
            background-color: var(--code-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 12px 0;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .tag-blue {
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }
        .tag-violet {
            background-color: rgba(167, 139, 250, 0.15);
            color: var(--accent-violet);
        }
        .tag-green {
            background-color: rgba(52, 211, 153, 0.15);
            color: var(--success);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            body[dir="rtl"] .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open-mobile {
                transform: translateX(0) !important;
            }
            .main-content {
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .card {
                padding: 14px 16px;
            }
            .truth-table th,
            .truth-table td {
                padding: 6px 8px;
                font-size: 0.78rem;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div style="padding: 20px 16px; border-bottom: 1px solid var(--border-subtle);">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:#fff;flex-shrink:0;">DM</div>
                <div>
                    <div style="font-weight:700;font-size:1rem;color:var(--text-primary);" data-i18n="app_title">Discrete Mathematics</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);" data-i18n="app_subtitle">Interactive Study Guide</div>
                </div>
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                <button onclick="switchLanguage('en')" id="langEnBtn" class="tag tag-blue" style="cursor:pointer;border:none;">EN</button>
                <button onclick="switchLanguage('ar')" id="langArBtn" class="tag tag-blue" style="cursor:pointer;border:none;opacity:0.5;">عربي</button>
            </div>
        </div>
        <nav id="sidebarNav" style="padding: 8px 0;"></nav>
        <div style="padding:16px;border-top:1px solid var(--border-subtle);font-size:0.75rem;color:var(--text-muted);text-align:center;">
            <span data-i18n="grading_note">Grading: Assignments 40% · Midterm 20% · Final 40%</span>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <header style="position:sticky;top:0;z-index:40;background-color:var(--bg-base);border-bottom:1px solid var(--border-subtle);height:var(--header-height);display:flex;align-items:center;padding:0 20px;gap:12px;">
            <button onclick="toggleSidebar()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:0.9rem;" aria-label="Toggle sidebar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div style="flex:1;max-width:500px;position:relative;">
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search topics..." style="width:100%;padding:8px 14px 8px 36px;border-radius:8px;border:1px solid var(--border-subtle);background-color:var(--bg-surface);color:var(--text-primary);font-size:0.85rem;outline:none;transition:border-color 0.2s;" data-i18n-placeholder="search_placeholder">
                <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
                <div id="searchResults" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:8px;margin-top:6px;max-height:300px;overflow-y:auto;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.3);"></div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                <button onclick="switchLanguage(currentLang === 'en' ? 'ar' : 'en')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-secondary);cursor:pointer;font-size:0.8rem;font-weight:600;" id="langToggleBtn" data-i18n="lang_toggle">عربي</button>
            </div>
        </header>

        <!-- Page Content -->
        <div style="padding:20px 28px 60px 28px;max-width:1000px;margin:0 auto;" id="pageContent">
            <!-- Content is rendered here by JS -->
        </div>

        <!-- Footer -->
        <footer style="border-top:1px solid var(--border-subtle);padding:20px 28px;text-align:center;color:var(--text-muted);font-size:0.8rem;">
            <p data-i18n="footer_text">Discrete Mathematics — Interactive Study Platform. Built for deep learning.</p>
            <p style="margin-top:4px;">© 2026 · <span data-i18n="footer_rights">All rights reserved</span></p>
        </footer>
    </div>

    <script>
        // ============================================================
        // CONTENT DATA — Bilingual (EN/AR)
        // ============================================================
        const contentData = {
            en: {
                app_title: "Discrete Mathematics",
                app_subtitle: "Interactive Study Guide",
                search_placeholder: "Search topics...",
                lang_toggle: "عربي",
                grading_note: "Grading: Assignments 40% · Midterm 20% · Final 40%",
                footer_text: "Discrete Mathematics — Interactive Study Platform. Built for deep learning.",
                footer_rights: "All rights reserved",
                breadcrumb_home: "Home",
                chapters: [{
                    id: "ch1",
                    number: "01",
                    title: "Introduction to Mathematical Logic",
                    icon: "🧠",
                    overview: "Fundamentals of propositional logic: propositions, statements, truth values, and open propositions.",
                    sections: [
                        { id: "ch1-s1", title: "What is Logic?", subsections: [
                            { type: "text", content: "Logic is the systematic study of valid reasoning. In computer science and mathematics, it forms the backbone of program design, circuit design, and formal verification. Propositional logic deals with statements that are either true or false — no ambiguity, no in-between." },
                            { type: "definition", title: "Definition: Proposition", content: "A <strong>proposition</strong> (or statement) is a declarative sentence that is either <strong>true (T)</strong> or <strong>false (F)</strong>, but not both simultaneously." },
                            { type: "real-world", title: "Real-World Connection", content: "When you write an <code>if</code> statement in programming, the condition inside parentheses is a proposition. For example, <code>if (age >= 18)</code> — the expression <code>age >= 18</code> evaluates to either true or false. This is exactly what propositional logic formalizes." }
                        ]},
                        { id: "ch1-s2", title: "The Statement/Proposition Game", subsections: [
                            { type: "text", content: "Let's analyze several sentences to determine whether they qualify as propositions:" },
                            { type: "example", title: "Example Analysis", content: "<ul style='list-style:disc;padding-left:24px;margin:8px 0;'><li>\"Elephants are bigger than mice.\" → <strong>Proposition</strong> (true)</li><li>\"520 < 111\" → <strong>Proposition</strong> (false)</li><li>\"y > 5\" → <strong>Not a proposition</strong> (depends on y — called an <em>open sentence</em>)</li><li>\"Please do not fall asleep.\" → <strong>Not a proposition</strong> (it's a request, not declarative)</li><li>\"x < y if and only if y > x\" → <strong>Proposition</strong> (always true, regardless of x and y)</li></ul>" },
                            { type: "key-takeaway", content: "Only <strong>declarative sentences</strong> with a definite truth value are propositions. Questions, commands, exclamations, and sentences with unbound variables are <strong>not</strong> propositions." }
                        ]},
                        { id: "ch1-s3", title: "Open Propositions (Propositional Functions)", subsections: [
                            { type: "text", content: "An <strong>open proposition</strong> (or predicate) is a statement involving one or more variables. Its truth value depends on the value assigned to the variable(s)." },
                            { type: "code", content: "P(x): x - 3 > 5\n\nP(2)  → 2 - 3 > 5  →  -1 > 5  →  false\nP(8)  → 8 - 3 > 5  →  5 > 5   →  false\nP(9)  → 9 - 3 > 5  →  6 > 5   →  true" },
                            { type: "text", content: "When we assign a specific value to the variable (e.g., x = 9), we say the variable is <strong>instantiated</strong>, and the open proposition becomes a closed proposition with a definite truth value." }
                        ]},
                        { id: "ch1-s4", title: "Combining Propositions", subsections: [
                            { type: "text", content: "Just as we combine numbers with arithmetic operations (+, -, ×, ÷), we combine propositions using <strong>logical connectives</strong> (also called logical operators). We denote propositions with letters: p, q, r, s, ..." },
                            { type: "text", content: "The six fundamental connectives we will study are: <strong>Negation (¬)</strong>, <strong>Conjunction (∧)</strong>, <strong>Disjunction (∨)</strong>, <strong>Exclusive-Or (⊕)</strong>, <strong>Implication (→)</strong>, and <strong>Biconditional (↔)</strong>. Each one has a precise truth table definition." }
                        ]}
                    ],
                    takeaways: [
                        "A proposition is a declarative statement that is either true or false.",
                        "Open sentences contain variables and are not propositions until instantiated.",
                        "Propositions can be combined using logical connectives to form compound propositions.",
                        "Truth values in logic correspond to 1 (true) and 0 (false) in digital circuits."
                    ],
                    quiz: [
                        { q: "Which of the following IS a proposition?", options: ["\"Please close the door.\"", "\"x + 2 = 7\"", "\"The sun rises in the east.\"", "\"Is it raining?\""],
                            correct: 2 },
                        { q: "What is the truth value of \"520 < 111\"?", options: ["True", "False", "It depends",
                                "Not a proposition"
                            ], correct: 1 },
                        { q: "\"y > 5\" is best classified as:", options: ["A proposition", "An open proposition",
                                "A tautology", "A contradiction"
                            ], correct: 1 },
                        { q: "In digital circuits, the truth value 'true' corresponds to which digit?", options: ["0",
                                "1", "2", "undefined"
                            ], correct: 1 }
                    ]
                }, {
                    id: "ch2",
                    number: "02",
                    title: "Logical Operators (Connectives)",
                    icon: "⚡",
                    overview: "Complete truth tables for all six logical connectives, operator precedence, tautologies, contradictions, and equivalence laws.",
                    sections: [
                        { id: "ch2-s1", title: "Negation (NOT) — ¬", subsections: [
                            { type: "text", content: "Negation is a <strong>unary operator</strong> that flips the truth value of a proposition. If p is true, ¬p is false, and vice versa." },
                            { type: "truth-table", headers: ["P", "¬P"], rows: [
                                ["T", "F"],
                                ["F", "T"]
                            ] },
                            { type: "example", title: "Example", content: "P: \"It is raining.\" → ¬P: \"It is NOT raining.\"" }
                        ]},
                        { id: "ch2-s2", title: "Conjunction (AND) — ∧", subsections: [
                            { type: "text", content: "Conjunction is a <strong>binary operator</strong>. P ∧ Q is true only when <strong>both</strong> P and Q are true." },
                            { type: "truth-table", headers: ["P", "Q", "P ∧ Q"], rows: [
                                ["T", "T", "T"],
                                ["T", "F", "F"],
                                ["F", "T", "F"],
                                ["F", "F", "F"]
                            ] },
                            { type: "real-world", title: "Programming Connection",
                                content: "In code, this is the <code>&&</code> operator. <code>if (isLoggedIn && hasPermission)</code> — both conditions must be true for the block to execute." }
                        ]},
                        { id: "ch2-s3", title: "Disjunction (OR) — ∨", subsections: [
                            { type: "text", content: "Disjunction is a <strong>binary operator</strong>. P ∨ Q is true when <strong>at least one</strong> of P or Q is true. (Inclusive OR.)" },
                            { type: "truth-table", headers: ["P", "Q", "P ∨ Q"], rows: [
                                ["T", "T", "T"],
                                ["T", "F", "T"],
                                ["F", "T", "T"],
                                ["F", "F", "F"]
                            ] },
                            { type: "real-world", title: "Real-World Usage",
                                content: "In a login system: \"Access granted if user has admin rights OR user has superuser rights.\" This is an inclusive OR — if both are true, access is still granted." }
                        ]},
                        { id: "ch2-s4", title: "Exclusive-Or (XOR) — ⊕", subsections: [
                            { type: "text", content: "XOR is true when <strong>exactly one</strong> of the inputs is true — not both." },
                            { type: "truth-table", headers: ["P", "Q", "P ⊕ Q"], rows: [
                                ["T", "T", "F"],
                                ["T", "F", "T"],
                                ["F", "T", "T"],
                                ["F", "F", "F"]
                            ] },
                            { type: "example", title: "Natural Language Ambiguity",

                            data-chapter="${ch.id}">
                        <span>${ch.icon} ${ch.number}. ${ch.title}</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="chevron" style="transform:rotate(${activeChapter === ch.id ? '0deg' : '-90deg'});transition:transform 0.2s;">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="nav-sublinks ${activeChapter === ch.id ? 'open' : ''}" id="subnav-${ch.id}">
                        ${ch.sections.map(s => `
                            <button class="nav-sublink ${activeSection === s.id ? 'active' : ''}" 
                                    onclick="navigateToSection('${ch.id}','${s.id}')">
                                ${s.title}
                            </button>
                        `).join('')}
                        <button class="nav-sublink" style="color:var(--success);" 
                                onclick="navigateToSection('${ch.id}','${ch.id}-quiz')">
                            📝 Quiz
                        </button>
                        <button class="nav-sublink" style="color:var(--warning);" 
                                onclick="navigateToSection('${ch.id}','${ch.id}-takeaways')">
                            🔑 Key Takeaways
                        </button>
                    </div>
                `;
                sidebarNavEl.appendChild(chapterDiv);
            });
        }

        function toggleChapterNav(chId) {
            const subnav = document.getElementById(`subnav-${chId}`);
            const btn = document.querySelector(`[data-chapter="${chId}"]`);
            if (subnav) {
                subnav.classList.toggle('open');
                const chevron = btn.querySelector('.chevron');
                if (chevron) {
                    chevron.style.transform = subnav.classList.contains('open') ? 'rotate(0deg)' : 'rotate(-90deg)';
                }
            }
            if (activeChapter === chId) {
                activeChapter = null;
                activeSection = null;
            } else {
                activeChapter = chId;
                activeSection = null;
                renderSidebar();
                renderPage(chId);
            }
        }

        function navigateToSection(chId, sectionId) {
            activeChapter = chId;
            activeSection = sectionId;
            renderSidebar();
            renderPage(chId);
            // Scroll to section
            setTimeout(() => {
                const el = document.getElementById(sectionId);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 100);
            if (window.innerWidth <= 768) {
                toggleSidebar(false);
            }
        }

        // ============================================================
        // PAGE RENDERING
        // ============================================================
        function renderPage(chId) {
            const data = contentData[currentLang];
            const chapter = data.chapters.find(c => c.id === chId);
            if (!chapter) return;

            // Breadcrumb
            const breadcrumbHtml = `
                <div class="breadcrumb">
                    <a href="#" onclick="renderHome();return false;">${data.breadcrumb_home}</a>
                    <span class="separator">/</span>
                    <span>${chapter.icon} ${chapter.title}</span>
                </div>
            `;

            let sectionsHtml = `
                <div style="margin-bottom:24px;">
                    <span class="tag tag-blue">${data.chapters.indexOf(chapter) + 1} / ${data.chapters.length}</span>
                    <h1 style="font-size:1.8rem;font-weight:800;margin:12px 0 8px;color:var(--text-primary);">${chapter.icon} ${chapter.title}</h1>
                    <p style="color:var(--text-secondary);font-size:1.05rem;">${chapter.overview}</p>
                </div>
            `;

            // Sections
            chapter.sections.forEach(section => {
                sectionsHtml += `<div id="${section.id}" style="margin-bottom:32px;padding-top:16px;">`;
                sectionsHtml += `<h2 style="font-size:1.3rem;font-weight:700;color:var(--accent);margin-bottom:12px;">${section.title}</h2>`;

                section.subsections.forEach(sub => {
                    if (sub.type === 'text') {
                        sectionsHtml += `<div style="margin:10px 0;color:var(--text-secondary);">${sub.content}</div>`;
                    } else if (sub.type === 'definition') {
                        sectionsHtml += `
                            <div class="definition-box">
                                <strong style="color:var(--accent);display:block;margin-bottom:4px;">📌 ${sub.title}</strong>
                                ${sub.content}
                            </div>
                        `;
                    } else if (sub.type === 'example') {
                        sectionsHtml += `
                            <div class="example-box">
                                <strong style="color:var(--accent-violet);display:block;margin-bottom:4px;">💡 ${sub.title || 'Example'}</strong>
                                ${sub.content}
                            </div>
                        `;
                    } else if (sub.type === 'real-world') {
                        sectionsHtml += `
                            <div style="background-color:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.25);border-radius:8px;padding:14px 18px;margin:12px 0;">
                                <strong style="color:var(--success);display:block;margin-bottom:4px;">🌍 ${sub.title || 'Real-World Connection'}</strong>
                                ${sub.content}
                            </div>
                        `;
                    } else if (sub.type === 'key-takeaway') {
                        sectionsHtml += `
                            <div class="key-takeaway">
                                <strong style="color:var(--success);display:block;margin-bottom:4px;">🔑 Key Takeaway</strong>
                                ${sub.content}
                            </div>
                        `;
                    } else if (sub.type === 'code') {
                        sectionsHtml += `<div class="code-block">${sub.content}</div>`;
                    } else if (sub.type === 'truth-table') {
                        sectionsHtml += `<div style="overflow-x:auto;"><table class="truth-table"><thead><tr>${sub.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${sub.rows.map(row => `<tr>${row.map(cell => `<td class="${cell === 'T' || cell === 'F' ? 'highlight' : ''}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
                    }
                });

                sectionsHtml += `</div>`;
            });

            // Quiz section
            sectionsHtml += `
                <div id="${chapter.id}-quiz" style="margin-bottom:32px;padding-top:16px;">
                    <h2 style="font-size:1.3rem;font-weight:700;color:var(--accent-violet);margin-bottom:12px;">📝 ${currentLang === 'en' ? 'Self-Assessment Quiz' : 'اختبار ذاتي'}</h2>
                    <div style="display:flex;flex-direction:column;gap:16px;">
            `;
            chapter.quiz.forEach((q, qIdx) => {
                sectionsHtml += `
                    <div class="card" style="padding:16px 20px;" data-quiz-id="${chId}-${qIdx}">
                        <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary);">Q${qIdx + 1}. ${q.q}</div>
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            ${q.options.map((opt, optIdx) => `
                                <label class="quiz-option" data-quiz="${chId}-${qIdx}" data-opt="${optIdx}" onclick="checkQuizAnswer('${chId}-${qIdx}', ${optIdx}, ${q.correct})">
                                    <input type="radio" name="quiz-${chId}-${qIdx}" value="${optIdx}">
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div class="quiz-feedback" id="feedback-${chId}-${qIdx}" style="margin-top:8px;font-size:0.85rem;font-weight:600;"></div>
                    </div>
                `;
            });
            sectionsHtml += `</div></div>`;

            // Takeaways
            sectionsHtml += `
                <div id="${chapter.id}-takeaways" style="margin-bottom:32px;padding-top:16px;">
                    <h2 style="font-size:1.3rem;font-weight:700;color:var(--success);margin-bottom:12px;">🔑 ${currentLang === 'en' ? 'Key Takeaways' : 'الخلاصات الرئيسية'}</h2>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${chapter.takeaways.map(t => `
                            <div class="key-takeaway" style="margin:0;padding:12px 16px;display:flex;align-items:flex-start;gap:10px;">
                                <span style="color:var(--success);font-weight:800;">✓</span>
                                <span style="color:var(--text-secondary);">${t}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            pageContentEl.innerHTML = breadcrumbHtml + sectionsHtml;
        }

        function renderHome() {
            const data = contentData[currentLang];
            activeChapter = null;
            activeSection = null;
            renderSidebar();
            pageContentEl.innerHTML = `
                <div style="text-align:center;padding:60px 20px;max-width:700px;margin:0 auto;">
                    <div style="font-size:3rem;margin-bottom:16px;">📚</div>
                    <h1 style="font-size:2rem;font-weight:800;color:var(--text-primary);margin-bottom:12px;">
                        ${data.app_title}
                    </h1>
                    <p style="color:var(--text-secondary);font-size:1.1rem;margin-bottom:24px;">
                        ${data.app_subtitle}
                    </p>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:32px;">
                        ${data.chapters.map(ch => `
                            <button onclick="navigateToChapter('${ch.id}')" 
                                    style="padding:10px 18px;border-radius:8px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-primary);cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.2s;"
                                    onmouseover="this.style.borderColor='var(--accent)';this.style.background='rgba(56,189,248,0.08)'"
                                    onmouseout="this.style.borderColor='var(--border-subtle)';this.style.background='var(--bg-surface)'">
                                ${ch.icon} ${ch.number}. ${ch.title}
                            </button>
                        `).join('')}
                    </div>
                    <div style="color:var(--text-muted);font-size:0.85rem;border-top:1px solid var(--border-subtle);padding-top:20px;">
                        ${data.grading_note}
                    </div>
                </div>
            `;
        }

        function navigateToChapter(chId) {
            activeChapter = chId;
            activeSection = null;
            renderSidebar();
            renderPage(chId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // QUIZ LOGIC
        // ============================================================
        function checkQuizAnswer(quizId, selectedOpt, correctOpt) {
            const feedbackEl = document.getElementById(`feedback-${quizId}`);
            const options = document.querySelectorAll(`.quiz-option[data-quiz="${quizId}"]`);
            let answered = false;

            options.forEach((opt, idx) => {
                const input = opt.querySelector('input');
                if (idx === correctOpt) {
                    opt.classList.add('correct');
                } else if (idx === selectedOpt && selectedOpt !== correctOpt) {
                    opt.classList.add('incorrect');
                }
                if (idx === selectedOpt) {
                    input.checked = true;
                }
                // Disable further clicks
                opt.style.pointerEvents = 'none';
                opt.style.cursor = 'default';
            });

            if (selectedOpt === correctOpt) {
                feedbackEl.textContent = '✅ ' + (currentLang === 'en' ? 'Correct!' : 'صحيح!');
                feedbackEl.style.color = 'var(--success)';
            } else {
                feedbackEl.textContent = '❌ ' + (currentLang === 'en' ? 'Incorrect. Try again or review the material.' :
                    'غير صحيح. حاول مرة أخرى أو راجع المادة.');
                feedbackEl.style.color = 'var(--error)';
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================
        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            if (searchQuery.length < 2) {
                searchResultsEl.style.display = 'none';
                return;
            }
            const data = contentData[currentLang];
            const results = [];
            data.chapters.forEach(ch => {
                // Search in chapter title and overview
                if (ch.title.toLowerCase().includes(searchQuery) || ch.overview.toLowerCase().includes(
                        searchQuery)) {
                    results.push({ chapterId: ch.id, type: 'chapter', text: ch.title, sectionId: null });
                }
                ch.sections.forEach(s => {
                    if (s.title.toLowerCase().includes(searchQuery)) {
                        results.push({ chapterId: ch.id, type: 'section', text: s.title, sectionId: s.id });
                    }
                    s.subsections.forEach(sub => {
                        if (sub.content && sub.content.toLowerCase().replace(/<[^>]*>/g, '').includes(
                                searchQuery)) {
                            results.push({ chapterId: ch.id, type: 'content', text: sub.content.replace(
                                    /<[^>]*>/g, '').substring(0, 80) + '...', sectionId: s.id });
                        }
                    });
                });
            });

            if (results.length === 0) {
                searchResultsEl.innerHTML = `<div style="padding:12px 16px;color:var(--text-muted);">${currentLang === 'en' ? 'No results found' : 'لا توجد نتائج'}</div>`;
            } else {
                searchResultsEl.innerHTML = results.slice(0, 12).map((r, i) => `
                    <button onclick="searchNavigate('${r.chapterId}', '${r.sectionId || ''}')" 
                            style="display:block;width:100%;padding:10px 16px;background:transparent;border:none;color:var(--text-secondary);text-align:left;cursor:pointer;font-size:0.82rem;border-bottom:1px solid var(--border-subtle);"
                            onmouseover="this.style.background='rgba(56,189,248,0.06)'"
                            onmouseout="this.style.background='transparent'">
                        <span style="color:var(--accent);font-weight:600;">${r.type === 'chapter' ? '📁' : r.type === 'section' ? '📄' : '...'}</span> ${r.text}
                    </button>
                `).join('');
            }
            searchResultsEl.style.display = 'block';
        }

        function searchNavigate(chId, sectionId) {
            searchResultsEl.style.display = 'none';
            searchInputEl.value = '';
            searchQuery = '';
            activeChapter = chId;
            activeSection = sectionId || null;
            renderSidebar();
            renderPage(chId);
            if (sectionId) {
                setTimeout(() => {
                    const el = document.getElementById(sectionId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ============================================================
        // KEYBOARD & UI EVENTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResultsEl.style.display = 'none';
                if (window.innerWidth <= 768 && sidebarOpen) {
                    toggleSidebar(false);
                }
            }
            if (e.key === '/' && !e.target.closest('input')) {
                e.preventDefault();
                searchInputEl.focus();
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebarEl.classList.remove('open-mobile');
                sidebarOverlayEl.classList.remove('active');
                if (sidebarOpen) {
                    sidebarEl.classList.remove('closed');
                    mainContentEl.classList.remove('expanded');
                }
            } else {
                sidebarEl.classList.remove('closed');
                mainContentEl.classList.remove('expanded');
                if (!sidebarOpen) {
                    sidebarEl.classList.remove('open-mobile');
                }
            }
        });

        searchInputEl.addEventListener('blur', () => {
            setTimeout(() => { searchResultsEl.style.display = 'none'; }, 200);
        });
        searchInputEl.addEventListener('focus', () => {
            if (searchQuery.length >= 2) {
                searchResultsEl.style.display = 'block';
            }
        });

        // ============================================================
        // INITIALIZE
        // ============================================================
        function init() {
            switchLanguage('en');
            renderHome();
            if (window.innerWidth > 768) {
                sidebarOpen = true;
                sidebarEl.classList.remove('closed');
            } else {
                sidebarOpen = false;
                sidebarEl.classList.remove('open-mobile');
            }
        }

        init();
    </script>
</body>
</html>
