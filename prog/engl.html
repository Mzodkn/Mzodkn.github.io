<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical English II — Interactive Study Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-surface-hover: #273449;
            --bg-elevated: #263449;
            --border-subtle: #334155;
            --border-strong: #475569;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --accent-violet: #a78bfa;
            --success: #34d399;
            --warning: #fbbf24;
            --error: #f87171;
            --code-bg: #0d1424;
            --sidebar-bg: #121a2b;
            --sidebar-width: 300px;
            --header-height: 64px;
        }

        * { box-sizing: border-box; transition: background-color 0.2s ease, border-color 0.2s ease; }
        html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-height) + 20px); }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Inter', 'Readex Pro', sans-serif;
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        body[dir="rtl"] { font-family: 'Cairo', 'Readex Pro', 'Inter', sans-serif; }
        body[dir="rtl"] code, body[dir="rtl"] .en-term {
            font-family: 'Inter', 'Readex Pro', monospace;
            direction: ltr;
            display: inline-block;
        }

        /* Sidebar */
        .sidebar {
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-subtle);
            position: fixed; top: 0; bottom: 0; left: 0;
            width: var(--sidebar-width);
            z-index: 50; overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }
        body[dir="rtl"] .sidebar { left: auto; right: 0; border-right: none; border-left: 1px solid var(--border-subtle); }
        .sidebar::-webkit-scrollbar { width: 5px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        .sidebar.closed { transform: translateX(-100%); }
        body[dir="rtl"] .sidebar.closed { transform: translateX(100%); }

        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body[dir="rtl"] .main-content { margin-left: 0; margin-right: var(--sidebar-width); }
        .main-content.expanded { margin-left: 0; }
        body[dir="rtl"] .main-content.expanded { margin-right: 0; }

        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.6); z-index: 45;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        /* Navigation */
        .nav-chapter { border-bottom: 1px solid rgba(51, 65, 85, 0.4); }
        .nav-chapter-btn {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; padding: 12px 16px;
            font-weight: 600; font-size: 0.9rem;
            color: var(--text-secondary); cursor: pointer;
            border: none; background: transparent; text-align: left;
        }
        body[dir="rtl"] .nav-chapter-btn { text-align: right; }
        .nav-chapter-btn:hover { background-color: rgba(56, 189, 248, 0.08); color: var(--text-primary); }
        .nav-chapter-btn.active {
            background-color: rgba(56, 189, 248, 0.12);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }
        body[dir="rtl"] .nav-chapter-btn.active { border-left: none; border-right: 3px solid var(--accent); }

        .nav-sublinks {
            overflow: hidden; max-height: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-sublinks.open { max-height: 700px; }
        .nav-sublink {
            display: block; padding: 8px 16px 8px 32px;
            font-size: 0.82rem; color: var(--text-muted);
            text-decoration: none; cursor: pointer;
            border: none; background: transparent;
            width: 100%; text-align: left;
        }
        body[dir="rtl"] .nav-sublink { padding: 8px 32px 8px 16px; text-align: right; }
        .nav-sublink:hover { color: var(--text-primary); background-color: rgba(255, 255, 255, 0.04); }
        .nav-sublink.active { color: var(--accent); }

        /* Components */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
        }
        .card:hover { border-color: var(--border-strong); }

        .definition-box {
            background-color: rgba(56, 189, 248, 0.06);
            border-left: 4px solid var(--accent);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
        }
        body[dir="rtl"] .definition-box {
            border-left: none; border-right: 4px solid var(--accent);
            border-radius: 8px 0 0 8px;
        }

        .example-box {
            background-color: rgba(167, 139, 250, 0.06);
            border-left: 4px solid var(--accent-violet);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
        }
        body[dir="rtl"] .example-box {
            border-left: none; border-right: 4px solid var(--accent-violet);
            border-radius: 8px 0 0 8px;
        }

        .key-takeaway {
            background-color: rgba(52, 211, 153, 0.06);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 10px;
            padding: 16px 20px;
            margin: 12px 0;
        }

        .table-wrapper {
            overflow-x: auto;
            margin: 16px 0;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }
        .data-table {
            width: 100%; border-collapse: collapse;
            font-size: 0.88rem;
        }
        .data-table th, .data-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }
        body[dir="rtl"] .data-table th,
        body[dir="rtl"] .data-table td { text-align: right; }
        .data-table th {
            background-color: var(--bg-elevated);
            font-weight: 700; color: var(--accent);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .data-table td { color: var(--text-secondary); }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

        .quiz-option {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 8px;
            border: 1px solid var(--border-subtle);
            cursor: pointer; margin: 6px 0;
            font-size: 0.9rem;
        }
        .quiz-option:hover {
            border-color: var(--border-strong);
            background-color: rgba(255, 255, 255, 0.03);
        }
        .quiz-option.correct {
            border-color: var(--success);
            background-color: rgba(52, 211, 153, 0.1);
            color: var(--success);
        }
        .quiz-option.incorrect {
            border-color: var(--error);
            background-color: rgba(248, 113, 113, 0.1);
            color: var(--error);
        }
        .quiz-option input[type="radio"] {
            accent-color: var(--accent);
            width: 18px; height: 18px; flex-shrink: 0;
        }

        .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex; align-items: center;
            gap: 8px; flex-wrap: wrap;
            padding: 12px 0;
        }
        .breadcrumb a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        .breadcrumb a:hover { color: var(--accent); }
        .breadcrumb .separator { color: var(--border-strong); }

        .code-block {
            background-color: var(--code-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 12px 0;
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #e2e8f0;
            line-height: 1.7;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .tag-blue { background-color: rgba(56, 189, 248, 0.15); color: var(--accent); }
        .tag-violet { background-color: rgba(167, 139, 250, 0.15); color: var(--accent-violet); }
        .tag-green { background-color: rgba(52, 211, 153, 0.15); color: var(--success); }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            body[dir="rtl"] .sidebar { transform: translateX(100%); }
            .sidebar.open-mobile { transform: translateX(0) !important; }
            .main-content { margin-left: 0 !important; margin-right: 0 !important; }
            .card { padding: 14px 16px; }
            .data-table th, .data-table td { padding: 8px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
        <div style="padding: 20px 16px; border-bottom: 1px solid var(--border-subtle);">
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;color:#fff;flex-shrink:0;">TE</div>
                <div>
                    <div style="font-weight:700;font-size:1rem;color:var(--text-primary);" data-i18n="app_title">Technical English II</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);" data-i18n="app_subtitle">Interactive Study Guide</div>
                </div>
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                <button onclick="switchLanguage('en')" id="langEnBtn" class="tag tag-blue" style="cursor:pointer;border:none;">EN</button>
                <button onclick="switchLanguage('ar')" id="langArBtn" class="tag tag-blue" style="cursor:pointer;border:none;opacity:0.5;">عربي</button>
            </div>
        </div>
        <nav id="sidebarNav" style="padding: 8px 0;"></nav>
        <div style="padding:16px;border-top:1px solid var(--border-subtle);font-size:0.72rem;color:var(--text-muted);text-align:center;">
            <span data-i18n="sidebar_note">5 Lectures · Bilingual · Interactive Quizzes</span>
        </div>
    </aside>

    <div class="main-content" id="mainContent">
        <header style="position:sticky;top:0;z-index:40;background-color:var(--bg-base);border-bottom:1px solid var(--border-subtle);height:var(--header-height);display:flex;align-items:center;padding:0 20px;gap:12px;">
            <button onclick="toggleSidebar()" style="background:transparent;border:none;color:var(--text-primary);cursor:pointer;" aria-label="Toggle sidebar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div style="flex:1;max-width:500px;position:relative;">
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search topics..." style="width:100%;padding:8px 14px 8px 36px;border-radius:8px;border:1px solid var(--border-subtle);background-color:var(--bg-surface);color:var(--text-primary);font-size:0.85rem;outline:none;" data-i18n-placeholder="search_placeholder">
                <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
                <div id="searchResults" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:8px;margin-top:6px;max-height:320px;overflow-y:auto;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.3);"></div>
            </div>
            <button onclick="switchLanguage(currentLang === 'en' ? 'ar' : 'en')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-secondary);cursor:pointer;font-size:0.8rem;font-weight:600;" id="langToggleBtn" data-i18n="lang_toggle">عربي</button>
        </header>

        <div style="padding:20px 28px 60px 28px;max-width:1000px;margin:0 auto;" id="pageContent"></div>

        <footer style="border-top:1px solid var(--border-subtle);padding:20px 28px;text-align:center;color:var(--text-muted);font-size:0.8rem;">
            <p data-i18n="footer_text">Technical English II — Interactive Study Platform</p>
        </footer>
    </div>

    <script>
        // ============================================================
        // CONTENT DATA
        // ============================================================
        const contentData = {
            en: {
                app_title: "Technical English II",
                app_subtitle: "Interactive Study Guide",
                search_placeholder: "Search topics...",
                lang_toggle: "عربي",
                sidebar_note: "5 Lectures · Bilingual · Interactive Quizzes",
                footer_text: "Technical English II — Interactive Study Platform. Built for deep learning.",
                breadcrumb_home: "Home",
                chapters: [
                // -------------------- CHAPTER 1 --------------------
                {
                    id: "ch1",
                    number: "01",
                    title: "Introduction to Technical English",
                    icon: "📘",
                    overview: "Definition of Technical English, the importance of technical vocabulary, and the grammar of voice and tense in technical writing.",
                    sections: [
                        { id: "ch1-s1", title: "What is Technical English?", subsections: [
                            { type: "text", content: "Technical English is the use of English in technical fields such as computer science, engineering, and technology. It focuses on clarity, accuracy, and technical vocabulary — in short, a way to explain technical information without ambiguity." },
                            { type: "definition", title: "Definition", content: "<strong>Technical English</strong> is the form of English used in scientific, engineering, and computing fields. It emphasizes <strong>clarity</strong>, <strong>accuracy</strong>, and <strong>technical vocabulary</strong> — explaining complex information precisely and unambiguously." },
                            { type: "real-world", title: "Why It Matters", content: "When you read a programming manual, an API reference, or a research paper — they are almost always written in English. Mastering Technical English unlocks the entire global knowledge base of your field." }
                        ]},
                        { id: "ch1-s2", title: "Why Technical English is Essential", subsections: [
                            { type: "text", content: "Three key reasons why every IT and engineering student needs Technical English:" },
                            { type: "example", title: "1. Understanding Technical Books & References", content: "Most computer science books and research papers are written in English. English helps you read textbooks, technical documents, and academic papers in your field." },
                            { type: "example", title: "2. Using Software and Applications", content: "Most software interfaces use English. English helps you understand menus, commands, error messages, and instructions in programs like IDEs, databases, and cloud platforms." },
                            { type: "example", title: "3. Understanding Technical Terms", content: "Technical fields use many English terms — such as <strong>database</strong>, <strong>network</strong>, <strong>algorithm</strong>, <strong>compiler</strong>, <strong>framework</strong> — that are used globally regardless of the local language." },
                            { type: "key-takeaway", content: "Technical English is not optional — it is the working language of the global tech industry." }
                        ]},
                        { id: "ch1-s3", title: "Technical Vocabulary", subsections: [
                            { type: "definition", title: "Technical Vocabulary", content: "Technical Vocabulary is the specialized vocabulary of any field which evolves due to the need for experts to communicate with <strong>clarity</strong>, <strong>precision</strong>, <strong>relevance</strong>, and <strong>brevity</strong>." },
                            { type: "text", content: "Before developing your technical vocabulary, you must first improve your <strong>general English vocabulary</strong>. The thirst to learn new words should be a continuous process. Whenever you learn a new word, try to use it while you communicate so it registers in your mind." },
                            { type: "text", content: "<strong>Strategies to build vocabulary:</strong>" },
                            { type: "code", content: "• Learn by knowing the origin of words (etymology)\n• Use a dictionary as an invaluable tool\n• Infer meaning from context (but be careful — the inferred meaning may not be exact)\n• Practice word formation: blending, compounding, coinage, borrowing, clipping\n• Understand derivation (using affixes)" },
                            { type: "definition", title: "Affixes & Derivation", content: "<strong>Derivation</strong> is the process where the form of a word changes with the help of <strong>affixes</strong> — small bits of language attached to root words. Affixes are divided into:<br>• <strong>Prefixes</strong> — added before the root (un-, mis-, pre-)<br>• <strong>Suffixes</strong> — added after the root (-ful, -less)" }
                        ]},
                        { id: "ch1-s4", title: "Voice and Tense", subsections: [
                            { type: "text", content: "In grammar, the term <strong>voice</strong> shows two different ways an action can be viewed:" },
                            { type: "code", content: "1. Someone or something PERFORMING an action  → Active Voice\n2. The action is BEING PERFORMED on someone/something → Passive Voice" },
                            { type: "text", content: "When we talk about a verb denoting an action, we also need to talk about the time during which the action occurs. This sense of time is reflected through <strong>tense</strong> — a concept fundamental to the grammar of any language. There is a strong link between the voice of the verb and the tense." }
                        ]},
                        { id: "ch1-s5", title: "Active vs Passive Voice", subsections: [
                            { type: "text", content: "Compare these two sentences:" },
                            { type: "code", content: "1. The operators conducted a test on the turbo generator.\n   → Active Voice (subject performs the action)\n\n2. A test was conducted on the turbo generator by the operators.\n   → Passive Voice (subject receives the action)" },
                            { type: "text", content: "In the first sentence, the subject (<em>the operators</em>) performs the action of the verb (<em>conducted</em>). In the second, the same subject receives the action. The verb <em>conducted</em> is descriptive, action-packed, and in <strong>active form</strong>. The verb <em>was conducted</em> contains the auxiliary verb <em>was</em> and is in <strong>passive voice</strong>." },
                            { type: "text", content: "<strong>Focus difference:</strong>" },
                            { type: "code", content: "The project was completed on time.        → focus on the PROJECT\nSohan's team completed the project on time. → focus on SOHAN'S TEAM" }
                        ]},
                        { id: "ch1-s6", title: "Active/Passive Across All Tenses", subsections: [
                            { type: "text", content: "The following table shows how each tense transforms between active and passive voice, using the verb <em>analyse</em>:" },
                            { type: "data-table", headers: ["Tense", "Active Voice", "Passive Voice"], rows: [
                                ["Simple Present", "analyses", "is analysed"],
                                ["Present Continuous", "is analyzing", "is being analysed"],
                                ["Simple Past", "analysed", "was analysed"],
                                ["Past Continuous", "was analysing", "was being analysed"],
                                ["Present Perfect", "has analysed", "has been analysed"],
                                ["Future", "will analyse", "will be analysed"],
                                ["Conditional", "would analyse", "would be analysed"],
                                ["Perfect Conditional", "would have analysed", "would have been analysed"]
                            ]}
                        ]},
                        { id: "ch1-s7", title: "Converting Active → Passive", subsections: [
                            { type: "text", content: "Follow these steps to change an active sentence into passive:" },
                            { type: "code", content: "1. Identify the subject (agent/doer)\n2. Identify the object (what received the action)\n3. Note the tense of the verb\n4. Begin the passive sentence with the OBJECT\n5. Use the past participle (V3) with the correct auxiliary verb\n6. End with \"by the\" + agent (if needed)" },
                            { type: "example", title: "Example", content: "<strong>Active:</strong> The Civil Engineers tried out different layouts.<br><strong>Passive:</strong> Different layouts were tried out by the Civil Engineers." }
                        ]},
                        { id: "ch1-s8", title: "Converting Passive → Active", subsections: [
                            { type: "text", content: "Follow these steps to change a passive sentence into active:" },
                            { type: "code", content: "1. Identify the agent (what follows \"by the...\")\n   • If not specified, infer from context\n2. Note the action performed (start of passive sentence)\n3. Note the tense of the verb\n4. Begin the active sentence with the AGENT\n5. Choose the verb form matching the agent (singular/plural) and tense" },
                            { type: "example", title: "Examples from the course table", content: "<strong>Passive:</strong> Multifarious operations are performed by these computers.<br><strong>Active:</strong> These computers perform multifarious operations.<br><br><strong>Passive:</strong> Results will be published in the next issue.<br><strong>Active:</strong> The researchers will publish the results in the next issue. (agent inferred)" }
                        ]},
                        { id: "ch1-s9", title: "When to Use Each Voice", subsections: [
                            { type: "definition", title: "When to use Active Voice", content: "Active voice gives importance to the <strong>doer</strong> of the action. It is used for <strong>clear, direct, and strong writing</strong> and requires action-packed verbs." },
                            { type: "definition", title: "When to use Passive Voice", content: "Passive voice gives importance to the <strong>action</strong>, not the doer. It is used in most <strong>formal writing</strong> — reports, proposals, complaints, and rejection letters — because the action (not the doer) needs emphasis." },
                            { type: "key-takeaway", content: "All sentences cannot be transformed. <strong>Only transitive verbs</strong> (verbs that take an object) can be transformed into passive voice." }
                        ]},
                        { id: "ch1-s10", title: "Summary: Voice and Tense", subsections: [
                            { type: "text", content: "To sum up: the tense of the verb undergoes a change when you transfer one voice into another. <strong>Passive construction is verbose (wordy), while active is crisp, direct, and unambiguous.</strong>" }
                        ]}
                    ],
                    takeaways: [
                        "Technical English = clarity + accuracy + technical vocabulary, without ambiguity.",
                        "English is essential for reading references, using software, and understanding technical terms.",
                        "Technical vocabulary evolves for precision and brevity; affixes (prefixes/suffixes) build derived words.",
                        "Active voice emphasizes the doer; passive voice emphasizes the action.",
                        "Only transitive verbs can be converted to passive voice.",
                        "Passive is verbose; active is crisp and direct."
                    ],
                    quiz: [
                        { q: "Technical English emphasizes all of the following EXCEPT:", options: ["Clarity", "Accuracy", "Ambiguity", "Technical vocabulary"], correct: 2 },
                        { q: "In \"The operators conducted a test,\" the verb 'conducted' is in:", options: ["Passive voice", "Active voice", "Future tense", "Conditional"], correct: 1 },
                        { q: "Which of the following is NOT a reason to learn Technical English?", options: ["Reading technical books", "Using software", "Understanding technical terms", "Avoiding programming altogether"], correct: 3 },
                        { q: "Only ______ verbs can be transformed into passive voice.", options: ["Intransitive", "Transitive", "Auxiliary", "Modal"], correct: 1 },
                        { q: "The passive form of \"The Committee has approved the Plan\" is:", options: ["The Plan has approved by the Committee", "The Plan has been approved by the Committee", "The Plan was approved by the Committee", "The Plan is approved by the Committee"], correct: 1 }
                    ]
                },
                // -------------------- CHAPTER 2 --------------------
                {
                    id: "ch2",
                    number: "02",
                    title: "Note Making & Summarizing",
                    icon: "📝",
                    overview: "Systematic methods for taking notes, reading strategies, abbreviations, the three methods of note making, and the Five C's of summarizing.",
                    sections: [
                        { id: "ch2-s1", title: "What is Note Making?", subsections: [
                            { type: "definition", title: "Note Making", content: "Note making is a <strong>systematic method</strong> of writing down quickly, briefly, and clearly the important points of a reading text. It is a <strong>productive skill</strong> integrating both reading and writing." },
                            { type: "text", content: "Note making is used to:" },
                            { type: "code", content: "• Keep a record of the main points for future use and reference\n• Revise for an exam\n• Update information" }
                        ]},
                        { id: "ch2-s2", title: "Reading Strategy", subsections: [
                            { type: "text", content: "A careful reading plan helps identify the central idea, important points, and supporting details. This enables you to understand the text quickly and make appropriate notes." },
                            { type: "code", content: "• Identify the central idea, important points, and supporting details\n• Recognize key lexical items related to the topic\n• Identify relationships among units within the text\n• Read key points and signal words\n• Ignore irrelevant matter and concentrate on main parts\n• Deduce meanings from context and infer relationships\n• Interpret graphic aids used in the text" }
                        ]},
                        { id: "ch2-s3", title: "How to Make Notes", subsections: [
                            { type: "text", content: "The standard procedure for making effective notes:" },
                            { type: "code", content: "1. READ the passage carefully\n\n2. HEADING\n   What is the main idea? Frame a heading based on the central idea\n   and write it in the middle of the page.\n\n3. SUBHEADINGS\n   How is the main idea presented and developed?\n   Are there two or three subordinate ideas?\n   Frame subheadings based on these.\n\n4. POINTS\n   Further details of the subtitles you wish to keep.\n   All subheadings should be written at a uniform distance\n   from the margin with proper indentation and numbering." },
                            { type: "key-takeaway", content: "Never write full sentences in notes. Use keywords, abbreviations, and symbols." }
                        ]},
                        { id: "ch2-s4", title: "Abbreviations in Note Making", subsections: [
                            { type: "text", content: "Using abbreviations saves time and space. Here are the standard techniques:" },
                            { type: "example", title: "1. Standard Abbreviations & Capitalized First Letters", content: "U.P., USA, USSR, UK<br>Common: Sc (Science), Geog (Geography), Mr, Mrs, Dr, Govt" },
                            { type: "example", title: "2. First and Last Letters with Apostrophe", content: "can't (cannot), w'out (without), wrt'g (writing)" },
                            { type: "example", title: "3. First Letters of Phrases", content: "Kg (Kilogram), PA (Per Annum), CV (Curriculum Vitae)" },
                            { type: "example", title: "4. First Few Letters of Words/Phrases", content: "Approx (Approximately), Diff (Difference), Prof (Professor)" },
                            { type: "example", title: "5. Generally Used Abbreviations", content: "e.g. (Example), viz (Namely), et al (and others), N.B. (Take note)" }
                        ]},
                        { id: "ch2-s5", title: "Three Methods of Note Making", subsections: [
                            { type: "definition", title: "1. Topicalising", content: "Main points and central idea are <strong>rephrased in points</strong>. Redundant words and phrases are removed." },
                            { type: "definition", title: "2. Schematizing", content: "Scientific and technical texts may contain forms, figures, classification, contrasts, processes. Notes can be organized in the form of <strong>tables and diagrams</strong>." },
                            { type: "definition", title: "3. Sequencing", content: "Making a <strong>clear layout</strong> for fast and accurate interpretation of notes — arranging points in logical order." }
                        ]},
                        { id: "ch2-s6", title: "How to Summarize", subsections: [
                            { type: "text", content: "Summarizing is a skill essential in many facets of life. In a technology-driven world, everyone values time — hence the art of <strong>condensation</strong>, giving a brief account that saves time. A summary provides maximum information in minimum words." },
                            { type: "text", content: "Summarizing improves our ability to write concisely by making us aware of details that can be avoided to achieve precision." }
                        ]},
                        { id: "ch2-s7", title: "The Five C's of Summarizing", subsections: [
                            { type: "definition", title: "1. Completeness", content: "The summary must contain <strong>all essential elements</strong> of the original." },
                            { type: "definition", title: "2. Compactness", content: "All ideas should form a <strong>compact whole</strong>. Unity is important." },
                            { type: "definition", title: "3. Conciseness", content: "<strong>Brevity is the soul of wit.</strong> All ideas should be clear and concise." },
                            { type: "definition", title: "4. Clarity", content: "Clarity of expression is essential. <strong>No vague statements.</strong>" },
                            { type: "definition", title: "5. Coherence", content: "All sentences/ideas should have <strong>logical, chronological, and spatial order</strong>. Linking of ideas must be coherent." },
                            { type: "key-takeaway", content: "Summarizing — like note making — is a productive skill integrating both reading and writing. To write effective summaries, read the material carefully with good comprehension." }
                        ]}
                    ],
                    takeaways: [

                        "A good reading plan focuses on central idea and signal words.",
                        "Never write full sentences — use abbreviations and symbols.",
                        "Three methods: topicalising, schematizing, sequencing.",

                    sections: [
                        { id: "ch3-s1", title: "Types of Nouns", subsections: [
                            { type: "text", content: "A noun is the part of speech that names a person, animal, place, thing, or quality of a thing. Nouns are classified into several categories:" },
                            { type: "data-table", headers: ["Type", "Definition", "Examples"], rows: [
                                ["Common noun", "General names", "girl, boy, woman, book, town, country"],
                                ["Abstract noun", "Ideas/qualities", "honesty, charity, wisdom"],
                                ["Collective noun", "Groups", "crowd, fleet, team, group"],
                                ["Concrete noun", "Physical substances", "iron, gold, silver"],
                                ["Countable noun", "Can be counted (sing/plural)", "pens, chairs, people, car"],
                                ["Uncountable noun", "Cannot be counted", "sugar, water, information"],
                                ["Proper noun", "Specific names", "Sita, Rama, Madras, Delhi"],
                                ["Gerund noun", "Verb + ing used as noun", "I love singing"]
                            ]}
                        ]},
                        { id: "ch3-s2", title: "Compound Nouns", subsections: [
                            { type: "definition", title: "Compound Noun", content: "An expression made up of <strong>more than one word</strong> that functions as a noun. They are formed by nouns modified by adjectives or other nouns." },
                            { type: "text", content: "Most frequently they are combinations of two nouns: <em>bank-account, baby-sitter, letter-box</em>." },
                            { type: "text", content: "<strong>Other combinations:</strong>" },
                            { type: "code", content: "Adjective + Noun:    black bird\nPreposition + Noun:  under-water\nNoun + Verb:         hair cut" },
                            { type: "text", content: "<strong>Writing style — three possibilities:</strong>" },
                            { type: "code", content: "One word:     earring\nWith hyphen:  pen-name\nSeparate:     tin opener" }
                        ]},
                        { id: "ch3-s3", title: "Classes of Compound Nouns", subsections: [
                            { type: "text", content: "Compound nouns may be countable, uncountable, or used only in singular or plural forms." },
                            { type: "example", title: "Common Countable Compound Nouns", content: "tea-bag, contact lens, credit card, food token, hand cuffs, windscreen" },

                            { type: "example", title: "Used Only in Plural", content: "roadworks, traffic-lights, dancing shoes, sun-glasses, human rights" }
                        ]},
                        { id: "ch3-s4", title: "Negative Prefixes", subsections: [
                            { type: "definition", title: "Prefix", content: "A syllable placed at the beginning of a word to create another word. The prefix may not have meaning in isolation, but it changes the meaning of the word." },
                            { type: "text", content: "Examples: <em>similar → dissimilar</em>, <em>kind → unkind</em>, <em>decent → indecent</em>, <em>obedient → disobedient</em>." },
                            { type: "key-takeaway", content: "Unfortunately, there is no easy way to know which prefix any adjective will use. When you learn a new adjective, note down whether it has an opposite formed with a prefix and, if so, what it is." }
                        ]},
                        { id: "ch3-s5", title: "Prefix Rules to Remember", subsections: [
                            { type: "code", content: "• in-  becomes im-  before a root beginning with 'm' or 'p'\n       Examples: immature, impatient, improbable\n\n• in-  becomes ir-  before a word beginning with 'r'\n       Examples: irreplaceable, irreversible\n\n• in-  becomes il-  before a word beginning with 'l'\n       Examples: illegal, illegible, illiterate\n\n• in-  does NOT always have a negative meaning — it can mean\n  'inside' or 'into': impart, internal, insert, income" },
                            { type: "text", content: "Although it is mainly adjectives that are made negative by prefixes, <strong>in-</strong> and <strong>dis-</strong> can also form the opposites of verbs (e.g., <em>appear → disappear</em>). The prefix here reverses the action of the verb." },
                            { type: "code", content: "More examples: disagree, disapprove, disbelieve, disconnect,\ndiscredit, dislike, dismount, disqualify, unbend, undo,\nundress, unfold, unload, unlock, unveil, unwrap, unzip." }
                        ]},
                        { id: "ch3-s6", title: "Categories of Prefixes", subsections: [
                            { type: "definition", title: "Reversative Prefixes (un-, de-, dis-)", content: "Have the meaning of <strong>reversal of action</strong>. No negative implication.<br>Examples: undo, untie, unpack, dehydrate, decode, defrost, decentralise, disown." },
                            { type: "definition", title: "Perforative Prefixes (mis-, mal-, pseudo-)", content: "Give the sense of <strong>ill, bad, wrong, wrongly</strong>.<br>Examples: misuse, misunderstanding, malfunction, malnutrition, pseudo-intellectual." },
                            { type: "definition", title: "Prefixes of Time and Order (fore-, pre-, post-, ex-, re-)", content: "Examples: forewarn, pre-war, post-war, ex-president, reappear." },
                            { type: "definition", title: "Prefixes that Change Word-Class (be-, en-, a-)", content: "These convert the base into a different word class.<br>Examples: bewitch, empower, astray." }
                        ]},
                        { id: "ch3-s7", title: "Negative Prefixes Summary", subsections: [
                            { type: "text", content: "The following prefixes reverse or negate the meaning of a word:" },
                            { type: "code", content: "a-    →  moral  →  amoral\nde-   →  centralize → decentralize\ndis-  →  respect → disrespect\nil-   →  logical → illogical, legal → illegal\nim-   →  polite → impolite\nin-   →  correct → incorrect\nir-   →  regular → irregular\nmis-  →  understand → misunderstand\nnon-  →  sense → nonsense\nun-   →  happy → unhappy" }
                        ]}
                    ],

                    sections: [
                        { id: "ch4-s1", title: "Why Requirements Engineering Matters", subsections: [
                            { type: "text", content: "In the software development lifecycle (SDLC), <strong>Requirements Engineering (RE)</strong> bridges the gap between high-level business goals and implementation-level code." },
                            { type: "key-takeaway", content: "More software projects fail due to <strong>poor, ambiguous, or incomplete requirements</strong> than due to technical coding errors." },
                            { type: "text", content: "For IT professionals, the ability to write <strong>precise, clear, and unambiguous</strong> specification documents is a foundational skill." }
                        ]},
                        { id: "ch4-s2", title: "Core Terminology", subsections: [
                            { type: "definition", title: "Requirement", content: "A statement that identifies a product or process operational constraint, characteristic, or attribute that must be verified and is <strong>contractually binding</strong>." },
                            { type: "text", content: "Before writing requirements, a strict distinction must be established between system states, operational constraints, and domain terminology." }
                        ]},
                        { id: "ch4-s3", title: "System vs. Software Requirements", subsections: [
                            { type: "definition", title: "System Requirements Specification (SyRS)", content: "High-level operational needs of an <strong>entire system</strong> — combining hardware, software, human operators, and physical infrastructure." },
                            { type: "definition", title: "Software Requirements Specification (SRS)", content: "Detailed breakdown focusing exclusively on <strong>software features</strong>, data behaviors, interfaces, and external constraints." },
                            { type: "key-takeaway", content: "SyRS = whole system (hardware + software + people). SRS = software only." }
                        ]},
                        { id: "ch4-s4", title: "Taxonomy: Functional vs Non-Functional", subsections: [
                            { type: "text", content: "Requirements are classified into two major categories: <strong>Functional Requirements (FRs)</strong> and <strong>Non-Functional Requirements (NFRs)</strong>." },
                            { type: "data-table", headers: ["Aspect", "Functional Requirements", "Non-Functional Requirements"], rows: [
                                ["Defines", "What the system should perform", "How the system should perform"],
                                ["Focus", "Inputs, transformations, outputs", "Performance, security, usability"],
                                ["Examples", "Login, CRUD, payment, routing", "Speed, uptime, encryption, UX"],
                                ["Structure", "[Subject] + [Modal Verb] + [Action] + [Object] + [Condition]", "Quality attribute + metric + condition"]
                            ]}
                        ]},
                        { id: "ch4-s5", title: "Functional Requirements (FRs)", subsections: [
                            { type: "text", content: "Functional requirements define the core functions, processing logic, data transformations, and interactions that the system must perform." },
                            { type: "definition", title: "Structure", content: "<code>[Subject] + [Modal Verb] + [System Action] + [Object] + [Condition/Context]</code>" },
                            { type: "example", title: "Example FR", content: "<em>The Authentication Module shall lock a user account for 15 minutes when three consecutive invalid login attempts occur within a 5-minute window.</em>" },
                            { type: "text", content: "<strong>Functional Categories:</strong>" },
                            { type: "code", content: "• User Authentication & Authorization\n  Access control, identity validation, role-based controls.\n\n• Data Processing & Storage\n  CRUD operations (Create, Read, Update, Delete),\n  transaction handling, validation rules.\n\n• External Interface Interactions\n  Data transfers via APIs, third-party payment gateways,\n  messaging queues.\n\n• Business Logic Execution\n  Domain-specific calculations (tax, routing protocols)." }
                        ]},
                        { id: "ch4-s6", title: "Non-Functional Requirements (NFRs)", subsections: [
                            { type: "text", content: "NFRs describe <strong>how well</strong> the system performs its functions. They dictate system properties such as performance, security, and reliability." },
                            { type: "data-table", headers: ["NFR Category", "Technical Focus", "Bad Example (Vague)", "Good Example (Quantified)"], rows: [
                                ["Performance", "Latency, Throughput, Resource Usage", "The system must load pages quickly.", "The web application shall render the dashboard within 1.5 seconds under a load of 500 concurrent active users."],
                                ["Security", "Encryption, Authentication, Confidentiality", "The database must be secure from hackers.", "The system shall encrypt all sensitive user data at rest using AES-256 and in transit using TLS 1.3."],
                                ["Availability / Reliability", "Uptime, MTBF (Mean Time Between Failures)", "The system should almost never go down.", "The core API service shall maintain an operational uptime of 99.95% per year."]
                            ]},
                            { type: "key-takeaway", content: "The difference between a bad and a good NFR is <strong>quantification</strong>. Vague statements like \"quickly\" or \"securely\" cannot be tested. Precise metrics (1.5 sec, 99.95%, AES-256) can be verified." }
                        ]}
                    ],
                    takeaways: [

                        "A requirement is a contractually binding statement of a constraint or attribute.",
                        "SyRS covers the whole system; SRS covers software only.",
                        "FRs = what the system does; NFRs = how well it does it.",
                        "FRs follow the structure: Subject + Modal Verb + Action + Object + Condition.",

                        { q: "MTBF is a technical focus of which NFR category?", options: ["Performance", "Security", "Availability/Reliability", "Usability"], correct: 2 }

                {
                    id: "ch5",
                    number: "05",
                    title: "Software & Process Documentation",
                    icon: "📚",
                    overview: "User manuals, process descriptions, API documentation, troubleshooting guides, and the core principles of technical writing for software.",
                    sections: [
                        { id: "ch5-s1", title: "Why Documentation Matters", subsections: [
                            { type: "text", content: "In the modern IT ecosystem, software is only as good as its documentation. <strong>Software & Process Documentation</strong> refers to the structured written materials, visual guides, and technical specifications that accompany software products to assist end-users, system administrators, and software engineers." },
                            { type: "text", content: "Documentation addresses four key questions:" },
                            { type: "code", content: "1. How to use the software (User Documentation / End-User Manuals)\n2. How internal processes flow (Process Descriptions & Architecture Diagrams)\n3. How systems integrate (API Documentation)\n4. How to diagnose and repair failures (Troubleshooting Guides & Post-Mortems)" }
                        ]},
                        { id: "ch5-s2", title: "Five Core Principles of Technical Writing", subsections: [
                            { type: "text", content: "Effective software documentation adheres to five fundamental pillars:" },
                            { type: "definition", title: "1. Conciseness", content: "Say what needs to be said in the fewest possible words — no filler." },
                            { type: "definition", title: "2. Clarity", content: "Use plain language, avoid jargon when possible, and make the message immediately understandable." },
                            { type: "definition", title: "3. Consistency", content: "Use the same terms, formatting, and tone throughout the document." },
                            { type: "definition", title: "4. Accuracy", content: "Every statement must be technically correct and up-to-date." },
                            { type: "definition", title: "5. Accessibility", content: "Written for the target audience — beginners vs. experts — using the appropriate level of detail." },
                            { type: "key-takeaway", content: "These five principles are the foundation of every professional documentation style guide." }
                        ]},
                        { id: "ch5-s3", title: "User Documentation & User Manuals", subsections: [
                            { type: "definition", title: "User Manual (User Guide)", content: "Provides <strong>step-by-step instructions</strong> enabling non-technical or technical end-users to operate a software application effectively." },
                            { type: "text", content: "<strong>Structural Standard for a User Manual:</strong>" },
                            { type: "code", content: "1. Title Page & Document Metadata (Version, Date, Author)\n2. System Requirements / Prerequisites\n3. Getting Started / Installation Guide\n4. Interface Overview & Navigation\n5. Core Tasks / Step-by-Step Procedures\n6. Troubleshooting & FAQ\n7. Glossary of Terms & Index" }
                        ]},
                        { id: "ch5-s4", title: "Process Mapping Notation", subsections: [
                            { type: "text", content: "Technical writers use standard visual notations to complement written text:" },
                            { type: "definition", title: "UML Activity Diagrams / Flowcharts", content: "Used for <strong>decision trees and control flow</strong> — showing the sequence of steps and branches." },
                            { type: "definition", title: "UML Sequence Diagrams", content: "Used for <strong>interaction between different software subsystems or APIs</strong> — showing the order of messages exchanged." }
                        ]},
                        { id: "ch5-s5", title: "Standard Process Description Template", subsections: [
                            { type: "text", content: "When documenting a system process, include the following structural elements:" },
                            { type: "code", content: "1. Process Title:      Clear name\n   (e.g., User Password Reset Workflow)\n\n2. Objective:           What this process achieves\n\n3. Triggers:            What initiates the process\n   (e.g., User clicks \"Forgot Password\")\n\n4. Inputs:              Required data or conditions before execution\n\n5. Execution Steps:     Sequential list of actions by actors/systems\n\n6. Outputs:             Resulting state, data saved, or notifications" }
                        ]},
                        { id: "ch5-s6", title: "API Documentation & Troubleshooting", subsections: [
                            { type: "text", content: "<strong>API Documentation</strong> explains how systems integrate. It typically includes:" },
                            { type: "code", content: "• Endpoints (URLs)\n• HTTP methods (GET, POST, PUT, DELETE)\n• Request/response formats (JSON, XML)\n• Authentication requirements\n• Error codes and their meanings\n• Code examples in multiple languages" },
                            { type: "text", content: "<strong>Troubleshooting Guides</strong> help diagnose and repair failures. They often follow a structured symptom → cause → solution format. <strong>Post-Mortems</strong> are written after incidents to document what went wrong and how to prevent recurrence." },
                            { type: "real-world", title: "Real-World Impact", content: "Every major tech company (Google, Microsoft, Amazon, Stripe) invests heavily in documentation. Stripe's API docs, for example, are considered a key competitive advantage — developers choose Stripe partly because their documentation is clear, complete, and full of working examples." }
                        ]}

                        "Process descriptions include: Title, Objective, Triggers, Inputs, Steps, Outputs.",

                            { type: "text", content: "الإنجليزية التقنية (Technical English) هي استخدام اللغة الإنجليزية في المجالات التقنية مثل علوم الحاسوب والهندسة والتكنولوجيا. تركز على <strong>الوضوح (Clarity)</strong> و<strong>الدقة (Accuracy)</strong> و<strong>المفردات التقنية (Technical Vocabulary)</strong> — باختصار، طريقة لشرح المعلومات التقنية دون غموض." },
                            { type: "definition", title: "التعريف", content: "<strong>الإنجليزية التقنية (Technical English)</strong> هي شكل اللغة الإنجليزية المستخدم في المجالات العلمية والهندسية والحاسوبية. تؤكد على الوضوح والدقة والمصطلحات التقنية — لشرح المعلومات المعقدة بشكل دقيق وغير غامض." },
                            { type: "real-world", title: "لماذا هي مهمة؟", content: "عندما تقرأ دليل برمجة أو مرجع API أو ورقة بحثية — تكون مكتوبة بالإنجليزية دائمًا تقريبًا. إتقان الإنجليزية التقنية يفتح لك قاعدة المعرفة العالمية في مجالك." }
                        ]},

                            { type: "text", content: "ثلاثة أسباب رئيسية تجعل الإنجليزية التقنية ضرورية لكل طالب في تقنية المعلومات والهندسة:" },
                            { type: "example", title: "1. فهم الكتب والمراجع التقنية", content: "معظم كتب علوم الحاسوب والأوراق البحثية مكتوبة بالإنجليزية. الإنجليزية تساعدك على قراءة الكتب المدرسية والوثائق التقنية والأوراق الأكاديمية." },
                            { type: "example", title: "2. استخدام البرامج والتطبيقات", content: "معظم واجهات البرامج تستخدم الإنجليزية. الإنجليزية تساعدك على فهم القوائم والأوامر ورسائل الأخطاء والتعليمات في البرامج مثل بيئات التطوير وقواعد البيانات والمنصات السحابية." },
                            { type: "example", title: "3. فهم المصطلحات التقنية", content: "المجالات التقنية تستخدم العديد من المصطلحات الإنجليزية — مثل <strong>database (قاعدة بيانات)</strong>، <strong>network (شبكة)</strong>، <strong>algorithm (خوارزمية)</strong>، <strong>compiler (مترجم)</strong>، <strong>framework (إطار عمل)</strong> — التي تُستخدم عالميًا بغض النظر عن اللغة المحلية." },
                            { type: "key-takeaway", content: "الإنجليزية التقنية ليست اختيارية — إنها لغة العمل في صناعة التكنولوجيا العالمية." }

                        { id: "ch1-s3", title: "المفردات التقنية (Technical Vocabulary)", subsections: [
                            { type: "definition", title: "المفردات التقنية", content: "المفردات التقنية هي المفردات المتخصصة لأي مجال، والتي تتطور بسبب حاجة الخبراء للتواصل بـ<strong>الوضوح (Clarity)</strong> و<strong>الدقة (Precision)</strong> و<strong>الملاءمة (Relevance)</strong> و<strong>الإيجاز (Brevity)</strong>." },
                            { type: "text", content: "قبل تطوير مفرداتك التقنية، يجب أولاً تحسين <strong>مفرداتك العامة في الإنجليزية</strong>. يجب أن يكون الشغف بتعلم كلمات جديدة عملية مستمرة. كلما تعلمت كلمة جديدة، حاول استخدامها أثناء التواصل حتى ترسخ في ذهنك." },
                            { type: "text", content: "<strong>استراتيجيات بناء المفردات:</strong>" },
                            { type: "code", content: "• التعلم بمعرفة أصل الكلمات (Etymology)\n• استخدام القاموس كأداة لا تقدر بثمن\n• استنتاج المعنى من السياق (لكن احذر — المعنى المستنتج قد لا يكون دقيقًا)\n• ممارسة تكوين الكلمات: blending, compounding, coinage, borrowing, clipping\n• فهم الاشتقاق (Derivation) باستخدام السوابق واللواحق (Affixes)" },
                            { type: "definition", title: "السوابق واللواحق (Affixes) والاشتقاق", content: "<strong>الاشتقاق (Derivation)</strong> هو عملية يتغير فيها شكل الكلمة بمساعدة <strong>السوابق واللواحق (Affixes)</strong> — أجزاء صغيرة من اللغة تُضاف إلى جذور الكلمات. تنقسم إلى:<br>• <strong>السوابق (Prefixes)</strong> — تُضاف قبل الجذر (un-, mis-, pre-)<br>• <strong>اللواحق (Suffixes)</strong> — تُضاف بعد الجذر (-ful, -less)" }
                        ]},
                        { id: "ch1-s4", title: "الصوت والزمن (Voice & Tense)", subsections: [
                            { type: "text", content: "في القواعد، مصطلح <strong>الصوت (Voice)</strong> يوضح طريقتين مختلفتين للنظر إلى الفعل:" },
                            { type: "code", content: "1. شخص أو شيء يقوم بفعل  → Active Voice (المبني للمعلوم)\n2. الفعل يقع على شخص أو شيء  → Passive Voice (المبني للمجهول)" },
                            { type: "text", content: "عندما نتحدث عن فعل يدل على حدث، نحتاج أيضًا للحديث عن الوقت الذي يحدث فيه. هذا الإحساس بالوقت ينعكس من خلال <strong>الزمن (Tense)</strong> — مفهوم أساسي في قواعد أي لغة. هناك صلة قوية بين صوت الفعل وزمنه." }
                        ]},
                        { id: "ch1-s5", title: "المبني للمعلوم مقابل المبني للمجهول", subsections: [
                            { type: "text", content: "قارن بين هاتين الجملتين:" },
                            { type: "code", content: "1. The operators conducted a test on the turbo generator.\n   → Active Voice (الفاعل يقوم بالفعل)\n\n2. A test was conducted on the turbo generator by the operators.\n   → Passive Voice (الفاعل يتلقى الفعل)" },
                            { type: "text", content: "في الجملة الأولى، الفاعل (<em>the operators</em>) يقوم بفعل الفعل (<em>conducted</em>). في الثانية، نفس الفاعل يتلقى الفعل. الفعل <em>conducted</em> وصفي ومليء بالحركة، وفي <strong>صيغة المبني للمعلوم</strong>. الفعل <em>was conducted</em> يحتوي على الفعل المساعد <em>was</em> وهو في <strong>المبني للمجهول</strong>." },

                            { type: "data-table", headers: ["الزمن (Tense)", "المبني للمعلوم (Active)", "المبني للمجهول (Passive)"], rows: [

                            { type: "text", content: "اتبع هذه الخطوات لتحويل جملة من المبني للمعلوم إلى المبني للمجهول:" },
                            { type: "code", content: "1. حدد الفاعل (Agent/Doer)\n2. حدد المفعول به (Object)\n3. لاحظ زمن الفعل\n4. ابدأ الجملة المجهولة بالمفعول به\n5. استخدم التصريف الثالث للفعل (Past Participle) مع الفعل المساعد المناسب\n6. اختم بـ \"by the\" + الفاعل (إذا لزم الأمر)" },

                            { type: "text", content: "اتبع هذه الخطوات لتحويل جملة من المبني للمجهول إلى المبني للمعلوم:" },

                            { type: "example", title: "أمثلة من جدول المقرر", content: "<strong>Passive:</strong> Multifarious operations are performed by these computers.<br><strong>Active:</strong> These computers perform multifarious operations.<br><br><strong>Passive:</strong> Results will be published in the next issue.<br><strong>Active:</strong> The researchers will publish the results in the next issue. (الفاعل مُستنتج)" }
                        ]},
                        { id: "ch1-s9", title: "متى نستخدم كل صوت؟", subsections: [
                            { type: "definition", title: "متى نستخدم المبني للمعلوم (Active)", content: "المبني للمعلوم يعطي أهمية لـ<strong>الفاعل (Doer)</strong>. يُستخدم للكتابة <strong>الواضحة والمباشرة والقوية</strong> ويتطلب أفعالًا مليئة بالحركة." },
                            { type: "definition", title: "متى نستخدم المبني للمجهول (Passive)", content: "المبني للمجهول يعطي أهمية لـ<strong>الفعل (Action)</strong> وليس الفاعل. يُستخدم في معظم <strong>الكتابات الرسمية</strong> — التقارير والعروض والشكاوى وخطابات الرفض — لأن الفعل (وليس الفاعل) يحتاج إلى تأكيد." },
                            { type: "key-takeaway", content: "ليس كل الجمل يمكن تحويلها. <strong>فقط الأفعال المتعدية (Transitive Verbs)</strong> التي تأخذ مفعولًا به يمكن تحويلها إلى المبني للمجهول." }
                        ]},
                        { id: "ch1-s10", title: "ملخص: الصوت والزمن", subsections: [
                            { type: "text", content: "للتلخيص: زمن الفعل يتغير عند نقل الصوت من صيغة إلى أخرى. <strong>التركيب المجهول مطوّل (Verbose)، بينما المعلوم موجز ومباشر وغير غامض.</strong>" }
                        ]}

                            { type: "code", content: "1. اقرأ المقطع بعناية\n\n2. العنوان (Heading)\n   ما هي الفكرة الرئيسية؟ صِغ عنوانًا بناءً على الفكرة المركزية\n   واكتبه في منتصف الصفحة.\n\n3. العناوين الفرعية (Subheadings)\n   كيف تُقدَّم الفكرة الرئيسية وتتطور؟\n   هل هناك فكرتان أو ثلاث أفكار فرعية؟\n   صِغ عناوين فرعية بناءً عليها.\n\n4. النقاط (Points)\n   تفاصيل إضافية للعناوين الفرعية تريد الاحتفاظ بها.\n   يجب كتابة جميع العناوين الفرعية على مسافة موحدة\n   من الهامش مع المسافة البادئة والترقيم المناسب." },

                            { type: "definition", title: "1. التصنيف الموضوعي (Topicalising)", content: "إعادة صياغة النقاط الرئيسية والفكرة المركزية <strong>في نقاط</strong>. تُحذف الكلمات والعبارات الزائدة." },

                            { type: "definition", title: "3. التسلسل (Sequencing)", content: "وضع <strong>تخطيط واضح</strong> لتفسير سريع ودقيق للملاحظات — ترتيب النقاط بترتيب منطقي." }

                        { id: "ch2-s6", title: "كيف تلخّص؟", subsections: [
                            { type: "text", content: "التلخيص مهارة أساسية في العديد من جوانب الحياة. في عالم مدفوع بالتكنولوجيا، الجميع يقدّر الوقت — ومن هنا فن <strong>التكثيف (Condensation)</strong>، تقديم سرد موجز يوفر الكثير من الوقت. الملخص يوفر أقصى قدر من المعلومات بأقل عدد من الكلمات." },
                            { type: "text", content: "التلخيص يحسّن قدرتنا على الكتابة بإيجاز من خلال جعلنا ندرك نوع التفاصيل التي يمكن تجنبها لتحقيق الدقة." }

                        { id: "ch2-s7", title: "الخمس C's للتلخيص", subsections: [
                            { type: "definition", title: "1. الاكتمال (Completeness)", content: "يجب أن يحتوي الملخص على <strong>جميع العناصر الأساسية</strong> من الأصل." },
                            { type: "definition", title: "2. التراص (Compactness)", content: "يجب أن تشكل جميع الأفكار <strong>كيانًا متراصًا</strong>. الوحدة مهمة." },
                            { type: "definition", title: "3. الإيجاز (Conciseness)", content: "<strong>الإيجاز روح الذكاء.</strong> يجب أن تكون جميع الأفكار واضحة وموجزة." },

                            { type: "definition", title: "2. الوضوح (Clarity)", content: "استخدم لغة بسيطة، وتجنب المصطلحات عندما يكون ذلك ممكنًا، واجعل الرسالة مفهومة فورًا." },
