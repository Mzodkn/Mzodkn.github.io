                            { type: "definition", title: "دليل المستخدم (User Manual)", content: "يقدم <strong>تعليمات خطوة بخطوة</strong> تمكّن المستخدمين النهائيين غير التقنيين أو التقنيين من تشغيل تطبيق برمجي بفعالية." },
                            { type: "text", content: "<strong>البنية المعيارية لدليل المستخدم:</strong>" },
                            { type: "code", content: "1. صفحة العنوان وبيانات الوثيقة (Version, Date, Author)\n2. متطلبات النظام / المتطلبات المسبقة\n3. البدء / دليل التثبيت\n4. نظرة عامة على الواجهة والتنقل\n5. المهام الأساسية / الإجراءات خطوة بخطوة\n6. استكشاف الأخطاء والأسئلة الشائعة (FAQ)\n7. مسرد المصطلحات والفهرس" }
                        ]},
                        { id: "ch5-s4", title: "تدوين خرائط العمليات", subsections: [
                            { type: "text", content: "يستخدم الكتّاب التقنيون تدوينات مرئية معيارية لاستكمال النص المكتوب:" },
                            { type: "definition", title: "مخططات النشاط UML / المخططات الانسيابية", content: "تُستخدم لـ<strong>أشجار القرار وتدفق التحكم</strong> — إظهار تسلسل الخطوات والفروع." },
                            { type: "definition", title: "مخططات التسلسل UML", content: "تُستخدم لـ<strong>التفاعل بين أنظمة البرمجيات الفرعية المختلفة أو APIs</strong> — إظهار ترتيب الرسائل المتبادلة." }
                        ]},
                        { id: "ch5-s5", title: "قالب وصف العملية المعياري", subsections: [
                            { type: "text", content: "عند توثيق عملية نظام، يجب تضمين العناصر البنيوية التالية:" },
                            { type: "code", content: "1. عنوان العملية (Process Title):  اسم واضح\n   (مثال: User Password Reset Workflow)\n\n2. الهدف (Objective):           ما تحققه هذه العملية\n\n3. المحفزات (Triggers):         ما يبدأ العملية\n   (مثال: ينقر المستخدم على \"Forgot Password\")\n\n4. المدخلات (Inputs):           البيانات أو الشروط المطلوبة قبل التنفيذ\n\n5. خطوات التنفيذ (Execution Steps): قائمة متسلسلة من الإجراءات\n\n6. المخرجات (Outputs):          الحالة الناتجة، البيانات المحفوظة، أو الإشعارات" }
                        ]},
                        { id: "ch5-s6", title: "توثيق API واستكشاف الأخطاء", subsections: [
                            { type: "text", content: "<strong>توثيق API</strong> يشرح كيفية تكامل الأنظمة. يتضمن عادةً:" },
                            { type: "code", content: "• نقاط النهاية (Endpoints / URLs)\n• طرق HTTP (GET, POST, PUT, DELETE)\n• صيغ الطلب/الاستجابة (JSON, XML)\n• متطلبات المصادقة\n• رموز الأخطاء ومعانيها\n• أمثلة برمجية بلغات متعددة" },
                            { type: "text", content: "<strong>أدلة استكشاف الأخطاء (Troubleshooting Guides)</strong> تساعد في تشخيص الأعطال وإصلاحها. غالبًا ما تتبع صيغة منظمة: <em>الأعراض → السبب → الحل</em>. <strong>تقارير ما بعد الحادث (Post-Mortems)</strong> تُكتب بعد الحوادث لتوثيق ما حدث خطأ وكيفية منع تكراره." },
                            { type: "real-world", title: "تأثير عملي", content: "كل شركة تقنية كبرى (Google, Microsoft, Amazon, Stripe) تستثمر بكثافة في التوثيق. توثيق API الخاص بـ Stripe، على سبيل المثال، يُعتبر ميزة تنافسية رئيسية — يختار المطورون Stripe جزئيًا لأن توثيقهم واضح وكامل ومليء بالأمثلة العملية." }
                        ]}
                    ],
                    takeaways: [
                        "البرمجيات فقط بجودة توثيقها.",
                        "الركائز الخمس للكتابة التقنية: الإيجاز، الوضوح، الاتساق، الدقة، إمكانية الوصول.",
                        "أدلة المستخدم تتبع بنية معيارية من 7 أجزاء.",
                        "مخططات النشاط UML تُظهر تدفق التحكم؛ مخططات التسلسل تُظهر تفاعل الأنظمة الفرعية.",
                        "أوصاف العمليات تتضمن: العنوان، الهدف، المحفزات، المدخلات، الخطوات، المخرجات.",
                        "توثيق API وأدلة استكشاف الأخطاء حاسمة للتكامل والدعم."
                    ],
                    quiz: [
                        { q: "أي مما يلي ليس من المبادئ الخمسة الأساسية للكتابة التقنية؟", options: ["الوضوح", "الإيجاز", "الإبداع", "الدقة"], correct: 2 },
                        { q: "أي مخطط UML يُستخدم لأشجار القرار وتدفق التحكم؟", options: ["Sequence Diagram", "Activity Diagram", "Class Diagram", "Use Case Diagram"], correct: 1 },
                        { q: "أي قسم ليس عادةً جزءًا من دليل المستخدم؟", options: ["البدء / التثبيت", "استكشاف الأخطاء والأسئلة الشائعة", "خطة تسويق الشركة", "مسرد المصطلحات"], correct: 2 },
                        { q: "قالب وصف العملية يجب أن يتضمن كل ما يلي ما عدا:", options: ["المحفزات", "المدخلات", "رواتب المديرين التنفيذيين", "المخرجات"], correct: 2 },
                        { q: "توثيق API يتضمن عادةً كل ما يلي ما عدا:", options: ["نقاط النهاية", "طرق HTTP", "سياسة إجازات الموظفين", "رموز الأخطاء"], correct: 2 }
                    ]
                }]
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let currentLang = 'en';
        let sidebarOpen = true;
        let activeChapter = null;
        let activeSection = null;
        let searchQuery = '';

        // DOM Refs
        const sidebarEl = document.getElementById('sidebar');
        const sidebarNavEl = document.getElementById('sidebarNav');
        const mainContentEl = document.getElementById('mainContent');
        const pageContentEl = document.getElementById('pageContent');
        const sidebarOverlayEl = document.getElementById('sidebarOverlay');
        const searchInputEl = document.getElementById('searchInput');
        const searchResultsEl = document.getElementById('searchResults');
        const langToggleBtn = document.getElementById('langToggleBtn');

        // ============================================================
        // LANGUAGE
        // ============================================================
        function switchLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.setAttribute('dir', document.body.dir);

            const langEnBtn = document.getElementById('langEnBtn');
            const langArBtn = document.getElementById('langArBtn');
            if (langEnBtn && langArBtn) {
                langEnBtn.style.opacity = lang === 'en' ? '1' : '0.5';
                langArBtn.style.opacity = lang === 'ar' ? '1' : '0.5';
            }
            langToggleBtn.textContent = lang === 'en' ? 'عربي' : 'English';

            searchInputEl.placeholder = contentData[lang].search_placeholder;

            renderSidebar();
            if (activeChapter) {
                renderPage(activeChapter);
            } else {
                renderHome();
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (contentData[lang][key]) el.textContent = contentData[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (contentData[lang][key]) el.placeholder = contentData[lang][key];
            });
        }

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar(forceState) {
            if (window.innerWidth <= 768) {
                sidebarOpen = forceState !== undefined ? forceState : !sidebarEl.classList.contains('open-mobile');
                sidebarEl.classList.toggle('open-mobile', sidebarOpen);
                sidebarOverlayEl.classList.toggle('active', sidebarOpen);
            } else {
                sidebarOpen = forceState !== undefined ? forceState : !sidebarOpen;
                sidebarEl.classList.toggle('closed', !sidebarOpen);
                mainContentEl.classList.toggle('expanded', !sidebarOpen);
            }
        }

        function renderSidebar() {
            const data = contentData[currentLang];
            sidebarNavEl.innerHTML = '';
            data.chapters.forEach(ch => {
                const chapterDiv = document.createElement('div');
                chapterDiv.className = 'nav-chapter';
                chapterDiv.innerHTML = `
                    <button class="nav-chapter-btn ${activeChapter === ch.id ? 'active' : ''}" 
                            onclick="toggleChapterNav('${ch.id}')" 
                            data-chapter="${ch.id}">
                        <span>${ch.icon} ${ch.number}. ${ch.title}</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="chevron" style="transform:rotate(${activeChapter === ch.id ? '0deg' : '-90deg'});transition:transform 0.2s;">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="nav-sublinks ${activeChapter === ch.id ? 'open' : ''}" id="subnav-${ch.id}">
                        ${ch.sections.map(s => `
                            <button class="nav-sublink ${activeSection === s.id ? 'active' : ''}" 
                                    onclick="navigateToSection('${ch.id}','${s.id}')">
                                ${s.title}
                            </button>
                        `).join('')}
                        <button class="nav-sublink" style="color:var(--success);" 
                                onclick="navigateToSection('${ch.id}','${ch.id}-quiz')">
                            📝 ${currentLang === 'en' ? 'Quiz' : 'اختبار'}
                        </button>
                        <button class="nav-sublink" style="color:var(--warning);" 
                                onclick="navigateToSection('${ch.id}','${ch.id}-takeaways')">
                            🔑 ${currentLang === 'en' ? 'Key Takeaways' : 'الخلاصات'}
                        </button>
                    </div>
                `;
                sidebarNavEl.appendChild(chapterDiv);
            });
        }

        function toggleChapterNav(chId) {
            const subnav = document.getElementById(`subnav-${chId}`);
            const btn = document.querySelector(`[data-chapter="${chId}"]`);
            if (subnav) {
                subnav.classList.toggle('open');
                const chevron = btn.querySelector('.chevron');
                if (chevron) {
                    chevron.style.transform = subnav.classList.contains('open') ? 'rotate(0deg)' : 'rotate(-90deg)';
                }
            }
            if (activeChapter === chId) {
                activeChapter = null;
                activeSection = null;
                renderHome();
            } else {
                activeChapter = chId;
                activeSection = null;
                renderSidebar();
                renderPage(chId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function navigateToSection(chId, sectionId) {
            activeChapter = chId;
            activeSection = sectionId;
            renderSidebar();
            renderPage(chId);
            setTimeout(() => {
                const el = document.getElementById(sectionId);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
            if (window.innerWidth <= 768) toggleSidebar(false);
        }

        // ============================================================
        // RENDER PAGE
        // ============================================================
        function renderPage(chId) {
            const data = contentData[currentLang];
            const chapter = data.chapters.find(c => c.id === chId);
            if (!chapter) return;

            const breadcrumbHtml = `
                <div class="breadcrumb">
                    <a href="#" onclick="renderHome();return false;">${data.breadcrumb_home}</a>
                    <span class="separator">/</span>
                    <span>${chapter.icon} ${chapter.title}</span>
                </div>
            `;

            let html = `
                <div style="margin-bottom:24px;">
                    <span class="tag tag-blue">${data.chapters.indexOf(chapter) + 1} / ${data.chapters.length}</span>
                    <h1 style="font-size:1.8rem;font-weight:800;margin:12px 0 8px;">${chapter.icon} ${chapter.title}</h1>
                    <p style="color:var(--text-secondary);font-size:1.05rem;">${chapter.overview}</p>
                </div>
            `;

            chapter.sections.forEach(section => {
                html += `<div id="${section.id}" style="margin-bottom:32px;padding-top:16px;">`;
                html += `<h2 style="font-size:1.3rem;font-weight:700;color:var(--accent);margin-bottom:12px;">${section.title}</h2>`;

                section.subsections.forEach(sub => {
                    if (sub.type === 'text') {
                        html += `<div style="margin:10px 0;color:var(--text-secondary);">${sub.content}</div>`;
                    } else if (sub.type === 'definition') {
                        html += `<div class="definition-box"><strong style="color:var(--accent);display:block;margin-bottom:4px;">📌 ${sub.title}</strong>${sub.content}</div>`;
                    } else if (sub.type === 'example') {
                        html += `<div class="example-box"><strong style="color:var(--accent-violet);display:block;margin-bottom:4px;">💡 ${sub.title || 'Example'}</strong>${sub.content}</div>`;
                    } else if (sub.type === 'real-world') {
                        html += `<div style="background-color:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.25);border-radius:8px;padding:14px 18px;margin:12px 0;"><strong style="color:var(--success);display:block;margin-bottom:4px;">🌍 ${sub.title || 'Real-World Connection'}</strong>${sub.content}</div>`;
                    } else if (sub.type === 'key-takeaway') {
                        html += `<div class="key-takeaway"><strong style="color:var(--success);display:block;margin-bottom:4px;">🔑 ${currentLang === 'en' ? 'Key Takeaway' : 'خلاصة'}</strong>${sub.content}</div>`;
                    } else if (sub.type === 'code') {
                        html += `<div class="code-block">${sub.content}</div>`;
                    } else if (sub.type === 'data-table') {
                        html += `<div class="table-wrapper"><table class="data-table"><thead><tr>${sub.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${sub.rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
                    }
                });
                html += `</div>`;
            });

            // Quiz
            html += `<div id="${chapter.id}-quiz" style="margin-bottom:32px;padding-top:16px;">
                <h2 style="font-size:1.3rem;font-weight:700;color:var(--accent-violet);margin-bottom:12px;">📝 ${currentLang === 'en' ? 'Self-Assessment Quiz' : 'اختبار ذاتي'}</h2>
                <div style="display:flex;flex-direction:column;gap:16px;">`;
            chapter.quiz.forEach((q, qIdx) => {
                html += `
                    <div class="card" style="padding:16px 20px;" data-quiz-id="${chId}-${qIdx}">
                        <div style="font-weight:600;margin-bottom:10px;">Q${qIdx + 1}. ${q.q}</div>
                        <div style="display:flex;flex-direction:column;gap:4px;">
                            ${q.options.map((opt, optIdx) => `
                                <label class="quiz-option" data-quiz="${chId}-${qIdx}" data-opt="${optIdx}" onclick="checkQuizAnswer('${chId}-${qIdx}', ${optIdx}, ${q.correct})">
                                    <input type="radio" name="quiz-${chId}-${qIdx}" value="${optIdx}">
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div class="quiz-feedback" id="feedback-${chId}-${qIdx}" style="margin-top:8px;font-size:0.85rem;font-weight:600;"></div>
                    </div>`;
            });
            html += `</div></div>`;

            // Takeaways
            html += `<div id="${chapter.id}-takeaways" style="margin-bottom:32px;padding-top:16px;">
                <h2 style="font-size:1.3rem;font-weight:700;color:var(--success);margin-bottom:12px;">🔑 ${currentLang === 'en' ? 'Key Takeaways' : 'الخلاصات الرئيسية'}</h2>
                <div style="display:flex;flex-direction:column;gap:8px;">
                    ${chapter.takeaways.map(t => `
                        <div class="key-takeaway" style="margin:0;padding:12px 16px;display:flex;align-items:flex-start;gap:10px;">
                            <span style="color:var(--success);font-weight:800;">✓</span>
                            <span style="color:var(--text-secondary);">${t}</span>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            pageContentEl.innerHTML = breadcrumbHtml + html;
        }

        function renderHome() {
            const data = contentData[currentLang];
            activeChapter = null;
            activeSection = null;
            renderSidebar();
            pageContentEl.innerHTML = `
                <div style="text-align:center;padding:60px 20px;max-width:750px;margin:0 auto;">
                    <div style="font-size:3rem;margin-bottom:16px;">📖</div>
                    <h1 style="font-size:2rem;font-weight:800;margin-bottom:12px;">${data.app_title}</h1>
                    <p style="color:var(--text-secondary);font-size:1.1rem;margin-bottom:32px;">${data.app_subtitle}</p>
                    <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
                        ${data.chapters.map(ch => `
                            <button onclick="navigateToChapter('${ch.id}')" 
                                    style="padding:12px 20px;border-radius:10px;border:1px solid var(--border-subtle);background:var(--bg-surface);color:var(--text-primary);cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.2s;text-align:left;max-width:280px;"
                                    onmouseover="this.style.borderColor='var(--accent)';this.style.background='rgba(56,189,248,0.08)'"
                                    onmouseout="this.style.borderColor='var(--border-subtle)';this.style.background='var(--bg-surface)'">
                                <div style="font-size:1.4rem;margin-bottom:4px;">${ch.icon}</div>
                                <div style="color:var(--accent);font-size:0.75rem;font-weight:700;margin-bottom:2px;">LECTURE ${ch.number}</div>
                                <div>${ch.title}</div>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
        }

        function navigateToChapter(chId) {
            activeChapter = chId;
            activeSection = null;
            renderSidebar();
            renderPage(chId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        // QUIZ
        // ============================================================
        function checkQuizAnswer(quizId, selectedOpt, correctOpt) {
            const feedbackEl = document.getElementById(`feedback-${quizId}`);
            const options = document.querySelectorAll(`.quiz-option[data-quiz="${quizId}"]`);

            options.forEach((opt, idx) => {
                const input = opt.querySelector('input');
                if (idx === correctOpt) opt.classList.add('correct');
                else if (idx === selectedOpt && selectedOpt !== correctOpt) opt.classList.add('incorrect');
                if (idx === selectedOpt) input.checked = true;
                opt.style.pointerEvents = 'none';
                opt.style.cursor = 'default';
            });

            if (selectedOpt === correctOpt) {
                feedbackEl.textContent = '✅ ' + (currentLang === 'en' ? 'Correct!' : 'صحيح!');
                feedbackEl.style.color = 'var(--success)';
            } else {
                feedbackEl.textContent = '❌ ' + (currentLang === 'en' ? 'Incorrect. Review the material above.' : 'غير صحيح. راجع المادة أعلاه.');
                feedbackEl.style.color = 'var(--error)';
            }
        }

        // ============================================================
        // SEARCH
        // ============================================================
        function handleSearch(query) {
            searchQuery = query.trim().toLowerCase();
            if (searchQuery.length < 2) {
                searchResultsEl.style.display = 'none';
                return;
            }
            const data = contentData[currentLang];
            const results = [];
            data.chapters.forEach(ch => {
                if (ch.title.toLowerCase().includes(searchQuery) || ch.overview.toLowerCase().includes(searchQuery)) {
                    results.push({ chapterId: ch.id, type: 'chapter', text: ch.title, sectionId: null });
                }
                ch.sections.forEach(s => {
                    if (s.title.toLowerCase().includes(searchQuery)) {
                        results.push({ chapterId: ch.id, type: 'section', text: s.title, sectionId: s.id });
                    }
                    s.subsections.forEach(sub => {
                        const raw = (sub.content || '').replace(/<[^>]*>/g, '');
                        if (raw.toLowerCase().includes(searchQuery)) {
                            results.push({ chapterId: ch.id, type: 'content', text: raw.substring(0, 80) + '...', sectionId: s.id });
                        }
                    });
                });
            });

            if (results.length === 0) {
                searchResultsEl.innerHTML = `<div style="padding:12px 16px;color:var(--text-muted);">${currentLang === 'en' ? 'No results found' : 'لا توجد نتائج'}</div>`;
            } else {
                searchResultsEl.innerHTML = results.slice(0, 12).map(r => `
                    <button onclick="searchNavigate('${r.chapterId}', '${r.sectionId || ''}')" 
                            style="display:block;width:100%;padding:10px 16px;background:transparent;border:none;color:var(--text-secondary);text-align:left;cursor:pointer;font-size:0.82rem;border-bottom:1px solid var(--border-subtle);"
                            onmouseover="this.style.background='rgba(56,189,248,0.06)'"
                            onmouseout="this.style.background='transparent'">
                        <span style="color:var(--accent);font-weight:600;">${r.type === 'chapter' ? '📁' : r.type === 'section' ? '📄' : '...'}</span> ${r.text}
                    </button>
                `).join('');
            }
            searchResultsEl.style.display = 'block';
        }

        function searchNavigate(chId, sectionId) {
            searchResultsEl.style.display = 'none';
            searchInputEl.value = '';
            searchQuery = '';
            activeChapter = chId;
            activeSection = sectionId || null;
            renderSidebar();
            renderPage(chId);
            if (sectionId) {
                setTimeout(() => {
                    const el = document.getElementById(sectionId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ============================================================
        // EVENTS & INIT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResultsEl.style.display = 'none';
                if (window.innerWidth <= 768 && sidebarOpen) toggleSidebar(false);
            }
            if (e.key === '/' && !e.target.closest('input')) {
                e.preventDefault();
                searchInputEl.focus();
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebarEl.classList.remove('open-mobile');
                sidebarOverlayEl.classList.remove('active');
                if (sidebarOpen) {
                    sidebarEl.classList.remove('closed');
                    mainContentEl.classList.remove('expanded');
                }
            } else {
                sidebarEl.classList.remove('closed');
                mainContentEl.classList.remove('expanded');
                if (!sidebarOpen) sidebarEl.classList.remove('open-mobile');
            }
        });

        searchInputEl.addEventListener('blur', () => {
            setTimeout(() => { searchResultsEl.style.display = 'none'; }, 200);
        });
        searchInputEl.addEventListener('focus', () => {
            if (searchQuery.length >= 2) searchResultsEl.style.display = 'block';
        });

        function init() {
            switchLanguage('en');
            renderHome();
            if (window.innerWidth > 768) {
                sidebarOpen = true;
                sidebarEl.classList.remove('closed');
            } else {
                sidebarOpen = false;
            }
        }

        init();
    </script>
</body>
</html>
