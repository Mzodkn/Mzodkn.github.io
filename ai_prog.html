
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C++ Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1c2333;--m:#667;--p:#4f46e5;--ok:#16a34a;--no:#dc2626;--b:#d9dcea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141c;--c:#1b1f2b;--t:#e8eaf3;--m:#99a;--b:#343a4f}}
:root[data-theme=dark]{--bg:#12141c;--c:#1b1f2b;--t:#e8eaf3;--m:#99a;--b:#343a4f}
*{box-sizing:border-box;letter-spacing:normal;text-transform:none}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 system-ui,sans-serif}
html[lang=ar] body{font-family:Cairo,"Segoe UI",Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:1.15rem;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:12px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn.g{background:transparent;color:var(--t);border:1px solid var(--b)}
.bar{height:6px;background:var(--b);border-radius:9px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--p);transition:width .3s}
.tag{color:var(--m);font-size:.85rem;margin-bottom:8px}.q{font-weight:600;font-size:1.1rem;margin:0 0 12px}
.o{position:relative;display:block;width:100%;text-align:start;background:transparent;border:1px solid var(--b);border-radius:10px;padding:10px 14px;margin-bottom:10px;color:inherit;font-family:inherit}
.o.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,transparent)}
.ring{position:absolute;top:-6px;inset-inline-start:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;overflow:visible}
.ring ellipse{fill:none;stroke:var(--no);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s forwards;vector-effect:non-scaling-stroke}
@keyframes dr{to{stroke-dashoffset:0}}
code,.code{font-family:ui-monospace,Consolas,monospace;direction:ltr;unicode-bidi:isolate;background:color-mix(in srgb,var(--p) 10%,transparent);padding:0 4px;border-radius:4px}
.code{display:block;padding:8px 12px;margin-bottom:12px;text-align:left;overflow-x:auto}
.s{display:inline-block;cursor:pointer;padding:2px 6px;border-radius:6px;border:1px dashed var(--b);margin:3px}.s.bad{border:2px solid var(--no);background:color-mix(in srgb,var(--no) 12%,transparent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .o{margin:0;padding:8px 10px;font-size:.92rem;border-width:2px}
.nav{display:flex;justify-content:space-between;gap:8px}
.big{font-size:2.4rem;font-weight:700;text-align:center}.ok{color:var(--ok)}.no{color:var(--no)}
.rv{border:1px solid;border-inline-start:6px solid;border-radius:8px;padding:12px;margin:16px 0;background:color-mix(in srgb,currentColor 5%,transparent)}
</style></head><body><main><header><h1 id="ti"></h1><span id="tm" dir="ltr"></span><button class="btn g" id="lg" onclick="tg()"></button></header><div id="app"></div></main>
<script>
const c=(q,o,a)=>({t:'c',q,o,a}),m=(q,o,a)=>({t:'m',q,o,a}),e=(s,bad,o,a)=>({t:'e',s,bad,o,a}),x=(q,L,R)=>({t:'x',q,L,R}),p=(q,co,a)=>({t:'p',q,co,a});
const D=[
p("Predict the output of the following code:||توقع مخرجات الكود التالي:","int x = 10;\nint *ptr = &x;\n*ptr = 20;\ncout << x;","20"),
p("Predict the output of the following code:||توقع مخرجات الكود التالي:","int x = 5;\nif (x > 10) \n    cout << \"A\";\nelse \n    cout << \"B\";","B"),
e(["void changeValue","(int p) {","    *p = 50;","}"],1,["(int *p) {","(int &p) {","(int *p) ;"],0),
c("Which data type stores `true` or `false`?||أي نوع بيانات يخزن القيمتين `true` أو `false`؟",['int','bool','char','string'],1),
c("Which is a valid variable name?||أي مما يلي اسم متغير صحيح؟",['2num','_total','class','my-var'],1),
c("How many bytes does `double` occupy?||كم بايت يشغل النوع `double`؟",['4','8','2','1'],1),
c("Which operator returns a variable's memory address?||أي معامل يعيد عنوان المتغير في الذاكرة؟",['*','&','?:','{ }'],1),
c("Which returns the smallest whole number not less than x?||أي دالة تعيد أصغر عدد صحيح لا يقل عن x؟",['floor(x)','abs(x)','ceil(x)','fabs(x)'],2),
c("What is the index of the first array element?||ما فهرس أول عنصر في المصفوفة؟",['1','0','-1','10'],1),
c("Which command exits a switch structure?||أي أمر يخرج من بنية `switch`؟",['default','case','break','else'],2),
c("Which is the conditional operator?||أي مما يلي هو المعامل الشرطي؟",['?:','&&','==','++'],0),
c("Which type stores a single character?||أي نوع يخزن حرفاً واحداً؟",['string','char','bool','float'],1),
c("Which header contains `abs`, `cos`, `exp`?||أي ملف رأس يحتوي `abs` و`cos` و`exp`؟",['<cmath>','<string>','<bool>','<array>'],0),
m("Which returns the absolute value of a double?||أي دالة تعيد القيمة المطلقة لعدد `double`؟",['abs(x)','fabs(x)','exp(x)','cos(x)'],1),
m("Overloaded functions must differ in…||يشترط في الدوال المحمّلة تحميلاً زائداً اختلاف…",["Formal parameter list (number or type)||قائمة المعاملات (العدد أو النوع)","Function body only||جسم الدالة فقط","Return statement only||عبارة return فقط","Nothing||لا شيء"],0),
m("A function prototype must end with…||يجب أن ينتهي النموذج الأولي للدالة بـ…",["a semicolon||فاصلة منقوطة","a colon||نقطتين","a curly bracket||قوس مجعد","a period||نقطة"],0),
m("An array's name acts as…||اسم المصفوفة يمثل…",["the address of its first element||عنوان أول عنصر فيها","its size||حجمها","its last value||آخر قيمة فيها","a copy of it||نسخة منها"],0),
m("What does `*(p+1)` access?||ماذا يصل إليه `*(p+1)`؟",["The next array element||العنصر التالي في المصفوفة","The address of p||عنوان p","A null pointer||مؤشر فارغ","Nothing||لا شيء"],0),
m("A void function…||الدالة من نوع `void`…",["returns an int||تعيد عدداً صحيحاً","performs actions without returning a value||تنفذ إجراءات دون إرجاع قيمة","must be named main||يجب تسميتها main","has no body||ليس لها جسم"],1),
m("In nested if, an else pairs with…||في `if` المتداخلة يرتبط `else` بـ…",["the closest unmatched if||أقرب if غير مقترن","the first if||أول if","the last if||آخر if","no if||لا if"],0),
m("According to the lecture, `char` occupies…||حسب المحاضرة يشغل `char`…",["1 byte||1 بايت","2 bytes||2 بايت","4 bytes||4 بايت","8 bytes||8 بايت"],1),
m("Why write `int *p = nullptr;`?||لماذا نكتب `int *p = nullptr;`؟",["To avoid invalid memory access||لتجنب الوصول غير الصحيح للذاكرة","To make p an array||لجعل p مصفوفة","To store text||لتخزين نص","To make p constant||لجعل p ثابتاً"],0),
m("Passing by address lets a function…||يتيح التمرير بالعنوان للدالة…",["modify the original variables||تعديل المتغيرات الأصلية","only read copies||قراءة نسخ فقط","skip parameters||تخطي المعاملات","return two values||إرجاع قيمتين"],0),
m("How is a constant declared?||كيف يُصرَّح عن ثابت؟",["`const` before the type||بوضع `const` قبل النوع","`var` after the name||بوضع `var` بعد الاسم","with `#`||باستخدام `#`","with `&`||باستخدام `&`"],0),
m("`floor(x)` returns…||تعيد `floor(x)`…",["the largest whole number not greater than x||أكبر عدد صحيح لا يزيد عن x","the smallest whole number not less than x||أصغر عدد صحيح لا يقل عن x","x squared||مربع x","the sign of x||إشارة x"],0),
e(["Variable names||أسماء المتغيرات","can start with||يمكن أن تبدأ بـ","a number||رقم","and are case-sensitive.||وهي حساسة لحالة الأحرف."],2,["a letter or underscore||حرف أو شرطة سفلية","a symbol||رمز","a keyword||كلمة محجوزة"],0),
e(["Arrays||المصفوفات","can be copied directly||يمكن نسخها مباشرة","with `list = myList;`||بالتعيين `list = myList;`"],1,["cannot be copied directly; loops are needed||لا يمكن نسخها مباشرة؛ نحتاج حلقات","are copied automatically||تنسخ تلقائياً","need pointers only||تحتاج مؤشرات فقط"],0),
e(["int x = 5;","int *p = x;","cout << *p;"],1,["int *p = &x;","int p = &x;","int *p = *x;"],0),
e(["The `int` type||النوع `int`","can contain||يمكن أن يحتوي على","decimals.||كسور عشرية."],1,["cannot contain||لا يحتوي على","must contain||يجب أن يحتوي على","always contains||يحتوي دائماً على"],0),
e(["A function prototype||النموذج الأولي للدالة","is written after main()||يُكتب بعد main()","and ends with a semicolon.||وينتهي بفاصلة منقوطة."],1,["is written before main()||يُكتب قبل main()","is written inside main()||يُكتب داخل main()","replaces main()||يحل محل main()"],0),
e(["Array indexes||فهارس المصفوفة","begin at||تبدأ من","1."],2,["0","-1","the array size||حجم المصفوفة"],0),
e(["`ceil(x)` returns the||تعيد `ceil(x)`","largest||أكبر","whole number not less than x.||عدداً صحيحاً لا يقل عن x."],1,["smallest||أصغر","nearest||أقرب","first||أول"],0),
e(["The `float` type||النوع `float`","occupies||يشغل","8 bytes.||8 بايت."],2,["4 bytes.||4 بايت.","2 bytes.||2 بايت.","1 byte.||1 بايت."],0),
e(["`else if` chains||سلاسل `else if`","are used for||تُستخدم لـ","single selection.||الاختيار الأحادي."],2,["multiple selections.||الاختيارات المتعددة.","repetition.||التكرار.","declaring pointers.||تعريف المؤشرات."],0),
e(["The `*` operator||المعامل `*`","returns a variable's address.||يعيد عنوان المتغير."],1,["accesses the value stored at an address||يصل إلى القيمة المخزنة في عنوان","declares a constant||يصرّح عن ثابت","ends a statement||ينهي عبارة"],0),
x("Match each type with its size||طابق كل نوع مع حجمه",['byte','short','int','double'],['1 byte||1 بايت','2 bytes||2 بايت','4 bytes||4 بايت','8 bytes||8 بايت']),
x("Match each function with its result||طابق كل دالة مع ناتجها",['abs(x)','fabs(x)','ceil(x)','floor(x)'],['Integer absolute value||القيمة المطلقة لعدد صحيح','Double absolute value||القيمة المطلقة لعدد حقيقي','Smallest whole number ≥ x||أصغر عدد صحيح ≥ x','Largest whole number ≤ x||أكبر عدد صحيح ≤ x']),
x("Match each symbol with its meaning||طابق كل رمز مع معناه",['&','*','?:','{ }'],['Address operator||معامل العنوان','Dereference operator||معامل الإحالة','Conditional operator||المعامل الشرطي','Compound statement||عبارة مركبة']),
x("Match each term with its description||طابق كل مصطلح مع وصفه",['nullptr','Void function||دالة void','Overloading||التحميل الزائد','Prototype||النموذج الأولي'],['Avoids invalid memory access||يتجنب الوصول غير الصحيح للذاكرة','Returns no value||لا تعيد قيمة','Same name, different parameters||نفس الاسم بمعاملات مختلفة','Heading written before main()||ترويسة تُكتب قبل main()']),
x("Match each type with what it stores||طابق كل نوع مع ما يخزنه",['char','bool','string','float'],['A single character||حرف واحد','true or false||true أو false','A sequence of characters||سلسلة أحرف','Real number, 4 bytes||عدد حقيقي، 4 بايت'])];
const S={en:{ti:"C++ Exam Practice",st:"Start exam",nx:"Next",pv:"Previous",fn:"Finish",chk:"Check Answer",crt:"Correct!",wrg:"Incorrect!",typ:"Type output here...",n:"Question",c:"Draw a circle around the correct answer",m:"Multiple choice",e:"Spot the error: tap the wrong part, then choose the correction",x:"Match Table A with Table B: tap an item, then its partner.",p:"Predict Output: Read the code and type the exact output.",co:"Choose the correction",sc:"Final Score",rv:"Review your mistakes",an:"Correct answer",re:"Try again",lg:"العربية",in:"Interactive test · questions: ",A:"Table A",B:"Table B"},
ar:{ti:"اختبار تدريبي في C++",st:"ابدأ الاختبار",nx:"التالي",pv:"السابق",fn:"إنهاء",chk:"تحقق من الإجابة",crt:"إجابة صحيحة!",wrg:"إجابة خاطئة!",typ:"اكتب المخرجات هنا...",n:"السؤال",c:"ارسم دائرة حول الإجابة الصحيحة",m:"اختيار من متعدد",e:"اكتشف الخطأ: اضغط على الجزء الخاطئ ثم اختر التصحيح",x:"طابق الجدول (أ) مع الجدول (ب): اضغط عنصراً ثم ما يقابله.",p:"توقع المخرجات: اقرأ الكود واكتب ما سيتم طباعته بالضبط.",co:"اختر التصحيح",sc:"النتيجة النهائية",rv:"مراجعة أخطائك",an:"الإجابة الصحيحة",re:"حاول مرة أخرى",lg:"English",in:"اختبار تفاعلي · عدد الأسئلة: ",A:"الجدول (أ)",B:"الجدول (ب)"}};
let lang='en',Q=[],i=0,A=[],C=[],T=0,tim,xs=null,scr='home';
const $=id=>document.getElementById(id),L=k=>S[lang][k];
const tr=s=>{const p=String(s).split('||');return p[lang=='ar'&&p[1]!=null?1:0]};
const H=s=>'<bdi>'+tr(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/`([^`]+)`/g,'<code>$1</code>')+'</bdi>';
const sh=a=>{a=[...a];for(let k=a.length;k>1;k--){const j=Math.random()*k|0;[a[k-1],a[j]]=[a[j],a[k-1]]}return a};
const RING='<svg class="ring" viewBox="0 0 100 40" preserveAspectRatio="none"><ellipse cx="50" cy="20" rx="48" ry="17" pathLength="1" transform="rotate(-1.5 50 20)"/></svg>';
function tg(){lang=lang=='en'?'ar':'en';document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';draw()}
function start(){Q=sh(D).map(q=>({...q,p:q.R?sh(q.R.map((_,k)=>k)):0}));A=Q.map(()=>null);C=Q.map(()=>false);i=0;xs=null;T=Q.length*40;clearInterval(tim);tim=setInterval(()=>{T--;tick();if(T<=0)fin()},1000);scr='q';draw()}
function tick(){$('tm').textContent=scr=='q'?Math.floor(T/60)+':'+String(T%60).padStart(2,'0'):''}
function draw(){$('ti').textContent=L('ti');$('lg').textContent=L('lg');tick();scr=='home'?home():scr=='q'?render():result()}
function home(){$('app').innerHTML=`<div class="card"><p class="q">${L('in')}${D.length}</p><button class="btn" onclick="start()">${L('st')}</button></div>`}
function pick(k){if(C[i])return;A[i]=k;draw()}
function pk2(k){if(C[i])return;A[i].o=k;draw()}
function tok(k){if(C[i])return;A[i]={b:k,o:null};draw()}
function xl(k){if(C[i])return;const a=A[i]||(A[i]={});if(a[k]!=null)delete a[k];else xs=k;draw()}
function xr(k){if(C[i])return;const a=A[i]||(A[i]={});const l=Object.keys(a).find(l=>a[l]==k);if(l!=null)delete a[l];else if(xs!=null){a[xs]=k;xs=null}draw()}
function pi(el){if(C[i])return;A[i]=el.value;const b=$('btn-chk');if(b)b.disabled=A[i].trim()==='';}
function check(){if(C[i])return;C[i]=true;draw()}
function go(d){i+=d;xs=null;draw()}
const col=l=>`style="border-color:hsl(${l*80+210} 70% 50%);background:hsl(${l*80+210} 70% 50%/.15)"`;
function render(){const q=Q[i];let h=`<div class="bar"><i style="width:${(i+1)/Q.length*100}%"></i></div><div class="card"><div class="tag">${L('n')} ${i+1}/${Q.length} · ${L(q.t)}</div>`;
if(q.t=='c'||q.t=='m'){h+=`<p class="q">${H(q.q)}</p>`+q.o.map((o,k)=>`<button class="o${A[i]===k?' sel':''}" onclick="pick(${k})">${A[i]===k&&q.t=='c'?RING:''}${H(o)}</button>`).join('')}
else if(q.t=='e'){const a=A[i],code=!q.s.some(s=>s.includes('||'));h+=`<p class="q">${L('e')}</p><div dir="ltr" style="text-align:left">`+q.s.map((s,k)=>`<span class="s${a&&a.b===k?' bad':''}${code?' code':''}" onclick="tok(${k})">${H(s)}</span>`).join('')+'</div>';
if(a)h+=`<p class="tag" style="margin-top:14px">${L('co')}</p>`+q.o.map((o,k)=>`<button class="o${a.o===k?' sel':''}" onclick="pk2(${k})">${H(o)}</button>`).join('')}
else if(q.t=='p'){h+=`<p class="q">${H(q.q)}</p><pre class="code"><code>${q.co}</code></pre><input type="text" class="o" style="background:var(--c);border:2px solid var(--b)" placeholder="${L('typ')}" value="${A[i]||''}" oninput="pi(this)" ${C[i]?'disabled':''}>`}
else{const a=A[i]||{},ri=k=>Object.keys(a).find(l=>a[l]==k);h+=`<p class="q">${H(q.q)}</p><div class="tag">${L('x')}</div><div class="g2"><div><b>${L('A')}</b></div><div><b>${L('B')}</b></div><div>`+q.L.map((o,l)=>`<button class="o" ${a[l]!=null?col(l):xs===l?'style="border-color:var(--p)"':''} onclick="xl(${l})">${H(o)}</button>`).join('<br>')+'</div><div>'+q.p.map(k=>{const l=ri(k);return `<button class="o" ${l!=null?col(l):''} onclick="xr(${k})">${H(q.R[k])}</button>`}).join('<br>')+'</div></div>'}

if(C[i]){
    let scVal=sc(q,A[i]); let isOk=scVal===1;
    let corAns='';
    if(q.t=='c'||q.t=='m') corAns=H(q.o[q.a]);
    else if(q.t=='p') corAns=q.a;
    else if(q.t=='e') corAns=H(q.s[q.bad])+' → '+H(q.o[q.a]);
    else if(q.t=='x') corAns=q.L.map((l,j)=>H(l)+' → '+H(q.R[j])).join('<br>');
    h+=`<div class="rv" style="color:var(--${isOk?'ok':'no'})"><b style="font-size:1.1rem">${L(isOk?'crt':'wrg')}</b>${!isOk?`<br><span style="color:var(--t)">${L('an')}:${corAns}</span>`:''}</div>`;
}

let ansd=A[i]!=null;
if(q.t=='x')ansd=A[i]&&Object.keys(A[i]).length===q.L.length;
if(q.t=='e')ansd=A[i]&&A[i].o!=null;
if(q.t=='p')ansd=A[i]&&String(A[i]).trim().length>0;

h+=`</div><div class="nav"><button class="btn g" ${i?'':'disabled'} onclick="go(-1)">${L('pv')}</button>`;
if(!C[i]) h+=`<button id="btn-chk" class="btn" ${ansd?'':'disabled'} onclick="check()">${L('chk')}</button>`;
else h+= i<Q.length-1 ? `<button class="btn" onclick="go(1)">${L('nx')}</button>` : `<button class="btn" onclick="fin()">${L('fn')}</button>`;
$('app').innerHTML=h+'</div>'}

function sc(q,a){if(!a&&a!==0)return 0;
if(q.t=='x')return Object.keys(a).filter(l=>a[l]==l).length/q.L.length;
if(q.t=='e')return a.b===q.bad&&a.o===q.a?1:0;
if(q.t=='p')return String(a).trim()===q.a.trim()?1:0;
return a===q.a?1:0}

function fin(){clearInterval(tim);scr='res';draw()}
function result(){const r=Q.map((q,k)=>sc(q,A[k])),tot=r.reduce((a,b)=>a+b,0),pc=Math.round(tot/Q.length*100);
let h=`<div class="card"><div class="tag">${L('sc')}</div><div class="big ${pc>=50?'ok':'no'}" dir="ltr">${+tot.toFixed(2)} / ${Q.length} (${pc}%)</div></div><h2>${L('rv')}</h2>`;
let hasErr = false;
Q.forEach((q,k)=>{if(r[k]<1){hasErr=true;const ans=q.t=='x'?q.L.map((l,j)=>H(l)+' → '+H(q.R[j])).join('<br>'):q.t=='e'?H(q.s[q.bad])+' → '+H(q.o[q.a]):q.t=='p'?q.a:H(q.o[q.a]);
let usr=q.t=='e'&&(A[k]&&A[k].o!=null)?H(q.o[A[k].o]):q.t=='x'?'':q.t=='p'?A[k]:A[k]!=null?H(q.o[A[k]]):'—';
h+=`<div class="rv" style="color:var(--no)"><div><b style="color:var(--t)">${q.t=='e'?q.s.map(H).join(' '):q.t=='p'?H(q.q)+'<br><code dir="ltr">'+q.co+'</code>':H(q.q)}</b></div><div style="margin-top:8px">❌ ${usr}</div><div style="margin-top:4px;color:var(--ok)">✅ ${ans}</div></div>`}});
if(!hasErr) h+=`<p style="text-align:center;font-size:1.2rem;font-weight:bold;color:var(--ok)">🎉 ممتاز! لا توجد أخطاء.</p>`;
$('app').innerHTML=h+`<button class="btn" style="width:100%" onclick="start()">${L('re')}</button>`}
draw();
</script></body></html>
